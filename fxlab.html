<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fxlab — every effect, one page (dev only)</title>
    <!--
      A development-only bench for the canvas effects. Open it at
      http://localhost:5173/fxlab.html with `npm run dev` running.

      WHY IT EXISTS. Three sessions in a row failed to verify the canvas by eye,
      and the reason was never the effects: an automated/occluded browser reports
      `document.hidden` (so requestAnimationFrame parks, correctly) *and*
      `prefers-reduced-motion: reduce` (which ConfigContext turns into calm, and
      calm hides the canvas). Both behaviours are right and neither is worth
      changing for a test. This page removes both obstacles instead — it has no
      calm, and it advances the clock from an explicit **Step** button, so it
      renders exactly the same frames whether the tab is visible, buried or
      screenshotted by a tool.

      WHY IT IS SAFE TO COMMIT. Vite's config declares no `rollupOptions.input`,
      so the build has exactly one entry — `index.html`. A second HTML file at
      the project root is served in dev and is *not* emitted into `dist`, so this
      page cannot reach production by accident. If anyone ever adds a multi-page
      `input` map, this file must be left out of it.

      The `?site=<base64>` published-config override that was written alongside
      this page during the same verification was deliberately NOT kept: a URL
      parameter that overrides the operator's published appearance is a public
      surface and a product decision, and this bench does not need it.

      WHAT IT IS NOT. It is not a design reference and it does not render the
      site's chrome. It reproduces `FxCanvas`'s frame maths and nothing else; if
      the two ever disagree, `src/fx/FxCanvas.tsx` is right and this is stale.
    -->
    <style>
      :root {
        color-scheme: dark;
        --lab-bg: #0b0e12;
        --lab-panel: #141920;
        --lab-line: #2a323d;
        --lab-fg: #d6dee8;
        --lab-dim: #8794a4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--lab-bg);
        color: var(--lab-fg);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        padding: 12px 18px;
        background: var(--lab-panel);
        border-bottom: 1px solid var(--lab-line);
      }
      header h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      label { display: flex; gap: 6px; align-items: center; color: var(--lab-dim); }
      select, input, button {
        font: inherit;
        color: var(--lab-fg);
        background: #1c232c;
        border: 1px solid var(--lab-line);
        border-radius: 6px;
        padding: 4px 8px;
      }
      button { cursor: pointer; }
      button:hover { border-color: #4a596b; }
      #status { margin-left: auto; color: var(--lab-dim); }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 16px;
        padding: 18px;
      }
      figure { margin: 0; }
      .frame {
        position: relative;
        border: 1px solid var(--lab-line);
        border-radius: 8px;
        overflow: hidden;
        background: #000;
      }
      canvas { display: block; width: 100%; height: 100%; }
      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding-top: 6px;
        color: var(--lab-dim);
        letter-spacing: 0.08em;
      }
      figcaption b { color: var(--lab-fg); font-weight: 600; }
      .bad { color: #ff8080; }
    </style>
  </head>
  <body>
    <header>
      <h1>fxlab</h1>
      <label>palette <select id="pal"></select></label>
      <label>shape
        <select id="shape">
          <option value="16:9">16:9 desktop</option>
          <option value="4:3">4:3 short</option>
          <option value="9:16">9:16 phone</option>
          <option value="21:9">21:9 ultrawide</option>
        </select>
      </label>
      <label>dpr <input id="dpr" type="number" min="1" max="3" step="0.5" value="2" style="width:64px" /></label>
      <label>step <input id="frames" type="number" min="1" max="2000" value="60" style="width:78px" /> frames</label>
      <!-- The duel's attract mode is the only thing that reads this; see
           `duelling` in src/fx/effects.ts. Left on the bench because it eases
           over ~1.6s and stepping frames is the only way to watch it here. -->
      <label><input id="sleeping" type="checkbox" /> screensaver</label>
      <button id="step">Step ▸</button>
      <button id="burst">+600</button>
      <button id="run">Run (rAF)</button>
      <button id="reset">Reset</button>
      <span id="status">idle</span>
    </header>
    <div id="grid"></div>

    <script type="module">
      import { drawFx } from "/src/fx/effects.ts";
      import { FX } from "/src/data/catalog.ts";
      import { PALETTES } from "/src/data/palettes.ts";

      // Mirrors FxCanvas: retina is worth paying for, a 3x phone panel is not,
      // and a long edge past this would ask for a 59M-pixel buffer.
      const MAX_EDGE = 2600;

      const ASPECTS = { "16:9": 16 / 9, "4:3": 4 / 3, "9:16": 9 / 16, "21:9": 21 / 9 };

      const palSelect = document.getElementById("pal");
      const shapeSelect = document.getElementById("shape");
      const dprInput = document.getElementById("dpr");
      const framesInput = document.getElementById("frames");
      const sleepingInput = document.getElementById("sleeping");
      const status = document.getElementById("status");
      const grid = document.getElementById("grid");

      PALETTES.forEach((p, i) => {
        const option = document.createElement("option");
        option.value = String(i);
        option.textContent = `${i} · ${p.name}`;
        palSelect.append(option);
      });

      /** One cell per entry in FX — hidden entries included; this is a bench. */
      const cells = FX.map((entry) => {
        const figure = document.createElement("figure");
        const frame = document.createElement("div");
        frame.className = "frame";
        const canvas = document.createElement("canvas");
        frame.append(canvas);
        const caption = document.createElement("figcaption");
        const name = document.createElement("b");
        name.textContent = entry.label;
        const meta = document.createElement("span");
        caption.append(name, meta);
        figure.append(frame, caption);
        grid.append(figure);
        return { entry, frame, canvas, meta, cache: {}, t: 0 };
      });

      /** Size every buffer the way FxCanvas does, from the element's own box. */
      function fit() {
        const aspect = ASPECTS[shapeSelect.value];
        const dpr = Math.max(1, Number(dprInput.value) || 1);
        for (const cell of cells) {
          const width = cell.frame.clientWidth;
          const height = Math.round(width / aspect);
          cell.frame.style.height = `${height}px`;
          const scale = Math.min(dpr, MAX_EDGE / Math.max(width, height));
          const bw = Math.max(1, Math.round(width * scale));
          const bh = Math.max(1, Math.round(height * scale));
          if (cell.canvas.width !== bw || cell.canvas.height !== bh) {
            cell.canvas.width = bw;
            cell.canvas.height = bh;
          }
          cell.w = width;
          cell.h = height;
          cell.scale = scale;
        }
      }

      /**
       * One frame, byte for byte the arithmetic in FxCanvas's `step` — the base
       * `setTransform` (so effects receive CSS pixels, which `rain`'s 16px cell
       * and `plasma`'s 26px grid depend on), then `t += 0.011 * boost`.
       */
      function advance(cell, frames, palette) {
        const ctx = cell.canvas.getContext("2d");
        if (!ctx) return;
        for (let i = 0; i < frames; i++) {
          ctx.setTransform(cell.scale, 0, 0, cell.scale, 0, 0);
          const boost = 1;
          cell.t += 0.011 * boost;
          drawFx(cell.entry.id, {
            ctx,
            w: cell.w,
            h: cell.h,
            p: palette,
            t: cell.t,
            beat: (Math.sin(cell.t * 1.9) + 1) / 2,
            boost,
            sleeping: sleepingInput.checked,
            // The bench always measures the top tier — the point is the true
            // cost, not what a throttled machine would fall back to.
            quality: 1,
            mx: 0.5,
            my: 0.5,
          }, cell.cache);
        }
      }

      function render(frames) {
        const palette = PALETTES[Number(palSelect.value)] ?? PALETTES[0];
        const started = performance.now();
        for (const cell of cells) advance(cell, frames, palette);
        const ms = performance.now() - started;
        for (const cell of cells) {
          cell.meta.textContent = `${cell.w}×${cell.h} · t ${cell.t.toFixed(1)}`;
        }
        status.textContent =
          `${frames} frame(s) × ${cells.length} effects in ${ms.toFixed(0)}ms` +
          ` · ${palette.name} · hidden=${document.hidden}`;
      }

      function reset() {
        for (const cell of cells) {
          cell.cache = {};
          cell.t = 0;
          const ctx = cell.canvas.getContext("2d");
          ctx?.setTransform(1, 0, 0, 1, 0, 0);
          ctx?.clearRect(0, 0, cell.canvas.width, cell.canvas.height);
        }
        render(1);
      }

      let raf = 0;
      const runButton = document.getElementById("run");
      runButton.addEventListener("click", () => {
        if (raf) {
          cancelAnimationFrame(raf);
          raf = 0;
          runButton.textContent = "Run (rAF)";
          return;
        }
        runButton.textContent = "Pause";
        const loop = () => {
          raf = requestAnimationFrame(loop);
          render(1);
        };
        raf = requestAnimationFrame(loop);
      });

      document.getElementById("step").addEventListener("click", () =>
        render(Math.max(1, Number(framesInput.value) || 1)),
      );
      document.getElementById("burst").addEventListener("click", () => render(600));
      document.getElementById("reset").addEventListener("click", reset);
      palSelect.addEventListener("change", () => render(1));
      shapeSelect.addEventListener("change", () => { fit(); reset(); });
      dprInput.addEventListener("change", () => { fit(); reset(); });
      // Sheet mode owns the grid: its four panels are built by `sheet()` and the
      // module-level `cells` still exist behind them, so letting the grid
      // renderer run on a resize repaints sixteen stale cells over the sheet and
      // overwrites its timings with a meaningless one-frame figure.
      window.addEventListener("resize", () => {
        if (new URLSearchParams(location.search).get("sheet")) return;
        fit();
        render(1);
      });

      /**
       * Contact-sheet mode — `?sheet=<effect id>`.
       *
       * The audit question is not "what does this effect look like" but "what
       * does it look like after thirty seconds", and those are different
       * questions for anything that accumulates: a trail that never clears, a
       * particle field that drifts off one edge, a wireframe that precesses
       * into a worse angle than the one it started at. A single live canvas
       * cannot answer it — the reviewer has to sit and wait, and a backgrounded
       * automation tab parks rAF so the wait never ends.
       *
       * So: one effect, four panels, rendered from a clean cache at 1s, 6s,
       * 15s and 30s of frames. `t += 0.011` per frame at 60fps, so those are
       * 60 / 360 / 900 / 1800 frames. Every panel is stepped from zero rather
       * than sampled out of one continuous run, because an effect that holds
       * state must be shown the state it would actually be in, and because a
       * shared run would let one panel's `save()` leak into the next.
       */
      const SHEET_STOPS = [
        { label: "1s", frames: 60 },
        { label: "6s", frames: 360 },
        { label: "15s", frames: 900 },
        { label: "30s", frames: 1800 },
      ];

      function sheet(id) {
        const entry = FX.find((f) => f.id === id) ?? FX[0];
        const palette = PALETTES[Number(palSelect.value)] ?? PALETTES[0];
        grid.textContent = "";
        // One row of four: the whole thirty seconds has to be legible in a
        // single glance, because the audit question is what *changes* between
        // the stops, and a comparison you have to scroll between is not one.
        // `?cols=1` renders the four stops stacked at full width instead of in a
        // row. The row is right for judging how an effect *evolves*; it is wrong
        // for judging cost, because several effects scale their content with the
        // box — `vessels` grows deeper before its `len < 14` floor bites, the
        // particle fields scale their counts with area, `plasma` grids at a fixed
        // 26px cell. A quarter-width panel therefore measures a fraction of the
        // work a real viewport asks for, and reading those numbers as the site's
        // cost understates the expensive effects badly.
        const cols = new URLSearchParams(location.search).get("cols") || "4";
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        document.title = `fx · ${entry.label} · 30s`;
        const timings = [];
        for (const stop of SHEET_STOPS) {
          const figure = document.createElement("figure");
          const frame = document.createElement("div");
          frame.className = "frame";
          const canvas = document.createElement("canvas");
          frame.append(canvas);
          const caption = document.createElement("figcaption");
          const name = document.createElement("b");
          name.textContent = `${entry.label} — ${stop.label}`;
          caption.append(name);
          figure.append(frame, caption);
          grid.append(figure);

          const aspect = ASPECTS[shapeSelect.value];
          const width = frame.clientWidth;
          const height = Math.round(width / aspect);
          frame.style.height = `${height}px`;
          const scale = Math.min(Math.max(1, Number(dprInput.value) || 1), MAX_EDGE / Math.max(width, height));
          canvas.width = Math.max(1, Math.round(width * scale));
          canvas.height = Math.max(1, Math.round(height * scale));

          /*
           * Time the *last* 30 frames, not the whole run.
           *
           * Averaging the full run is the obvious thing and it is wrong: the
           * 30s panel runs 1800 synchronous iterations and absorbs more GC and
           * more scheduler interference than the 60-frame panel, so every
           * effect appears to get steadily more expensive with time whether or
           * not it does. That artefact reads exactly like an unbounded buffer,
           * and chasing it means "fixing" effects that hold no state at all.
           * The warm-up frames also carry first-call JIT, which drags the 1s
           * figure the other way.
           *
           * The last 30 frames are the steady-state cost, which is the number
           * that matters, and comparing it across the four stops is then a real
           * answer to "does this effect get more expensive as it runs".
           */
          /*
           * Report the *minimum* of three short windows, not one long average.
           *
           * A single window is still wrong even after moving it to the end of
           * the run: the 30s panel renders last and absorbs the garbage from the
           * three panels before it, so one collection inside a thirty-frame
           * window multiplies the reported cost several times over. That showed
           * up as `vessels` at 5.7ms/f and `telemetry` at 7ms/f — both of which
           * vanished on a re-run, and neither of which holds any state that
           * grows.
           *
           * The minimum of several windows is the right statistic here. Frame
           * cost has a hard floor — the work the effect actually does — and
           * everything above it is interference from the collector and the
           * scheduler. Taking the minimum reports the floor. Chasing the mean
           * means chasing the interference, and "fixing" effects that are fine.
           */
          const cell = { entry, canvas, w: width, h: height, scale, cache: {}, t: 0 };
          const WINDOW = 20;
          advance(cell, Math.max(0, stop.frames - WINDOW * 3), palette);
          let best = Infinity;
          for (let pass = 0; pass < 3; pass++) {
            const n = Math.min(WINDOW, stop.frames);
            const started = performance.now();
            advance(cell, n, palette);
            best = Math.min(best, (performance.now() - started) / n);
          }
          timings.push(`${stop.label} ${best.toFixed(2)}`);
        }
        status.textContent = `${entry.label} · ${palette.name} · steady ms/f — ${timings.join(" · ")}`;
        return status.textContent;
      }

      // Exposed so an automation tool can drive the bench without clicking:
      //   await window.fxlab.render(600)
      window.fxlab = { render, reset, fit, cells, sheet };

      const sheetId = new URLSearchParams(location.search).get("sheet");
      if (sheetId) {
        const pal = new URLSearchParams(location.search).get("pal");
        if (pal) palSelect.value = pal;
        sheet(sheetId);
      } else {
        fit();
        render(90);
      }
    </script>
  </body>
</html>
