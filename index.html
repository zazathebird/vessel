<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mcclevarty.ca</title>
    <!-- An inline data: icon, not a file: no image files and no third-party
         assets (SPEC.md § Assets). The drawing is the client's own choice
         (2026-08-13): the finger, offered to a small four-pane window. Having
         *an* icon also keeps /favicon.ico from falling through to the Worker
         and being answered with the app shell, once per visitor. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ctext%20x='26'%20y='54'%20font-size='50'%20text-anchor='middle'%3E🖕%3C/text%3E%3Cg%20fill='none'%20stroke='%23888888'%20stroke-width='4'%3E%3Crect%20x='40'%20y='4'%20width='20'%20height='20'%20rx='2'/%3E%3Cpath%20d='M50%204v20M40%2014h20'/%3E%3C/g%3E%3C/svg%3E"
    />
    <!-- The search-result snippet, and the one piece of copy on the site that
         a stranger reads *before* they ever reach it. It said "free diagnosis"
         until 2026-08-26 — the client killed that claim in the page copy on
         2026-08-14 ("i dont do free diag") and this file was missed, so Google
         kept advertising a term of business that does not exist. Nothing here
         may promise anything the client has not said, and no fee is named.
         It also carried "One person, no shopfront" for the rest of that day,
         which the same client then banned site-wide ("get rid of ANYTHING and
         EVERYTHING that involves… saying its just one person"). Twice in one
         day, in the one string no browser renders: whatever rule the copy is
         under, check this file. -->
    <meta
      name="description"
      content="Independent computer repair: laptops, desktops, failed hard drives, virus removal and home networking. Twenty-plus years on the bench."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
