<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duel Cycle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#050507;
    font-family:'JetBrains Mono', monospace;
  }

  /* The engine is a PANEL, not a page. Everything below is positioned
     against #duelPanel, never against the viewport, so the same markup
     drops into a page at any size. The host sizes the panel; the panel
     sizes itself to nothing. */
  #duelPanel {
    position:relative; overflow:hidden;
    width:100%; height:100%;
    background:#050507;
    container-type:inline-size;
    --pad: clamp(10px, 2.4cqw, 22px);
  }
  #duelPanel canvas { display:block; width:100%; height:100%; }

  #vignette {
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(0,0,0,0.62) 100%);
  }

  /* --- title card ------------------------------------------------- */
  #titleCard {
    position:absolute; top:7%; left:50%; translate:-50% -8px;
    text-align:center; pointer-events:none; width:100%;
    opacity:0; transition:opacity 0.6s ease, translate 0.6s ease;
  }
  #titleCard.show { opacity:1; translate:-50% 0; }
  #titleCard .names {
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(20px, 5cqw, 54px);
    letter-spacing:0.06em;
    color:#f2f2f2;
    text-shadow:0 0 18px rgba(0,0,0,0.85), 0 2px 4px rgba(0,0,0,0.6);
    line-height:1.05;
  }
  #titleCard .vs {
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(8px, 1.1cqw, 10px); letter-spacing:0.5em; color:#9a9aa5;
    margin-top:5px; text-shadow:0 1px 3px rgba(0,0,0,0.9);
  }

  #resultCard {
    position:absolute; top:15%; left:50%; translate:-50% 10px; width:100%;
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(16px, 3cqw, 30px);
    letter-spacing:0.14em;
    color:#ffd966;
    text-shadow:0 0 20px rgba(255,180,60,0.5), 0 2px 4px rgba(0,0,0,0.75);
    opacity:0; transition:opacity 0.5s ease, translate 0.5s ease;
    pointer-events:none; text-align:center;
  }
  #resultCard.show { opacity:1; translate:-50% 0; }
  #resultCard .sub {
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:9px; letter-spacing:0.3em; color:#8d8d98;
    margin-top:6px; text-shadow:none;
  }

  /* --- controls ----------------------------------------------------
     Hidden until the panel is hovered or something inside it has focus,
     so the default state of a background panel is just the fight. */
  #controls {
    position:absolute; bottom:var(--pad); left:50%; translate:-50% 0;
    display:flex; align-items:center; gap:8px;
    background:rgba(12,12,17,0.62);
    border:1px solid rgba(255,255,255,0.09);
    backdrop-filter:blur(10px);
    padding:8px 11px; border-radius:999px;
    max-width:calc(100% - var(--pad)*2);
    opacity:0.14; transition:opacity 0.35s ease;
  }
  #duelPanel:hover #controls, #controls:focus-within { opacity:1; }
  .ctlBtn {
    appearance:none; border:none; cursor:pointer;
    background:rgba(255,255,255,0.06);
    color:#e8e8ec;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.08em;
    padding:8px 13px; border-radius:999px;
    transition:background 0.2s ease, scale 0.15s ease;
    white-space:nowrap;
  }
  .ctlBtn:hover { background:rgba(255,255,255,0.14); }
  .ctlBtn:active { scale:0.96; }
  .ctlBtn:focus-visible { outline:2px solid #ffd966; outline-offset:2px; }
  .ctlBtn.on { background:rgba(255,217,102,0.16); color:#ffd966; }
  #fightLabel {
    font-size:9px; letter-spacing:0.2em; color:#7a7a85;
    padding:0 8px; min-width:118px; text-align:center;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  #loading {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#6a6a75; font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.2em;
    background:#050507; z-index:10;
  }

  /* Container queries, not media queries — the panel may be 400px wide
     inside a 1600px page, and it is the panel that has to adapt. */
  @container (max-width: 560px){
    #fightLabel { display:none; }
    .ctlBtn { padding:7px 10px; font-size:10px; }
    #controls { opacity:0.5; }
  }
  @media (prefers-reduced-motion: reduce){
    #titleCard, #resultCard, .ctlBtn, #controls { transition:none; }
  }
</style>
</head>
<body>

<div id="duelPanel">
  <canvas id="c"></canvas>
  <div id="vignette"></div>

  <div id="titleCard">
    <div class="names" id="namesLine"></div>
    <div class="vs" id="arenaLine">DUEL</div>
  </div>
  <div id="resultCard"></div>

  <div id="controls">
    <button class="ctlBtn" id="playBtn">⏸ PAUSE</button>
    <div id="fightLabel">—</div>
    <button class="ctlBtn" id="soundBtn">♪ SOUND</button>
    <button class="ctlBtn" id="skipBtn">SKIP ⏭</button>
  </div>

  <div id="loading">IGNITING…</div>
</div>

<script>
(function(){
"use strict";

/* ==================================================================
   DUEL CYCLE — procedural duel engine
   Fights are generated at runtime from a choreography grammar, so no
   two duels share the same beat sequence.
   ================================================================== */

/* ============================== UTIL ============================== */
const TAU = Math.PI*2;
const DEG = Math.PI/180;
function lerp(a,b,t){ return a+(b-a)*t; }
function lerpAngle(a,b,t){ const d=((b-a)%360+540)%360-180; return a+d*t; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function easeOutQuad(t){ return 1-(1-t)*(1-t); }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function easeInCubic(t){ return t*t*t; }
function easeOutBack(t){ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
function rand(a,b){ return a+Math.random()*(b-a); }
function randInt(a,b){ return Math.floor(rand(a,b+1)); }
function choice(arr){ return arr[(Math.random()*arr.length)|0]; }
function chance(p){ return Math.random()<p; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function weightedPick(entries){
  // entries: [{v, w}]
  let total = 0;
  for(const e of entries) total += Math.max(0, e.w);
  if(total<=0) return entries[0].v;
  let r = Math.random()*total;
  for(const e of entries){ r -= Math.max(0, e.w); if(r<=0) return e.v; }
  return entries[entries.length-1].v;
}
// point at angle (0=up, 90=forward) & length from origin, mirrored by dir
function pt(o, angleDeg, len, dir){
  const r = angleDeg*DEG;
  return { x:o.x+Math.sin(r)*len*dir, y:o.y-Math.cos(r)*len };
}
/* The one shared wall clock. Effects that wobble read it rather than each
   growing a timer, so everything that flickers flickers in step. */
function clock(){ return state ? state.clock : 0; }
function rotAround(p, c, rad){
  const dx=p.x-c.x, dy=p.y-c.y;
  const cs=Math.cos(rad), sn=Math.sin(rad);
  return { x:c.x+dx*cs-dy*sn, y:c.y+dx*sn+dy*cs };
}

/* ============================== RIG ============================== */
const RIG = {
  spine:70, headR:15, shoulderW:15, upperArm:33, forearm:31,
  thigh:41, shin:39, hipHeight:76
};

/* ============================== POSES ==============================
   angle convention: 0 = up, 90 = forward(+dir), 180 = down, 270 = back
   Every pose is built through P() so missing fields fall back to a
   neutral standing rig — no pose can be half-defined.
*/
const POSE_BASE = {
  lean:6, headTilt:0, rot:0, hipBob:0,
  // grip: how much of the off hand is on the weapon. 1 = both hands on the
  // hilt (solved by IK in computeJoints), 0 = the pose's own armL angles.
  // A scalar rather than a flag so `lerpPose` can blend releasing the grip.
  grip:1,
  weaponExtend:1, weaponAngle:35, weaponAngleL:325,
  armR:{shoulder:105, elbow:55}, armL:{shoulder:200, elbow:205},
  legR:{hip:168, knee:176}, legL:{hip:196, knee:184}
};
function P(o){
  const out = Object.assign({}, POSE_BASE, o);
  for(const k of ['armR','armL','legR','legL']){
    out[k] = Object.assign({}, POSE_BASE[k], (o && o[k]) || {});
  }
  return out;
}

const POSES = {
  /* --- neutral / ceremonial --- */
  igniteStart: P({ weaponExtend:0, armR:{shoulder:112, elbow:60}, weaponAngle:40 }),
  ready:       P({ lean:6, armR:{shoulder:105, elbow:55}, weaponAngle:35 }),
  salute:      P({ lean:2, armR:{shoulder:132, elbow:18}, armL:{shoulder:198, elbow:200},
                   weaponAngle:2, legR:{hip:172,knee:179}, legL:{hip:192,knee:181} }),
  circleStep:  P({ lean:7, headTilt:-2, armR:{shoulder:72, elbow:42}, armL:{shoulder:208, elbow:216},
                   weaponAngle:22, legR:{hip:150,knee:168}, legL:{hip:210,knee:188}, hipBob:1 }),

  /* --- guards --- */
  guard:      P({ lean:8, headTilt:-2, armR:{shoulder:65, elbow:35}, armL:{shoulder:210, elbow:220},
                  weaponAngle:15, legR:{hip:155,knee:170}, legL:{hip:205,knee:185} }),
  guardHigh:  P({ lean:4, headTilt:-3, armR:{shoulder:24, elbow:344}, armL:{shoulder:202, elbow:228},
                  weaponAngle:302, legR:{hip:150,knee:168}, legL:{hip:210,knee:188} }),
  guardLow:   P({ lean:11, headTilt:2, armR:{shoulder:148, elbow:160}, armL:{shoulder:214, elbow:214},
                  weaponAngle:142, legR:{hip:158,knee:172}, legL:{hip:202,knee:182}, hipBob:3 }),
  guardBack:  P({ lean:2, headTilt:-4, armR:{shoulder:302, elbow:298}, armL:{shoulder:96, elbow:80},
                  weaponAngle:282, legR:{hip:160,knee:174}, legL:{hip:204,knee:184} }),

  /* --- windups --- */
  windupHigh: P({ lean:-8, headTilt:5, armR:{shoulder:12, elbow:340}, armL:{shoulder:226, elbow:246},
                  weaponAngle:326, legR:{hip:140,knee:160}, legL:{hip:215,knee:190}, hipBob:-4 }),
  windupSide: P({ lean:-7, headTilt:3, armR:{shoulder:332, elbow:302}, armL:{shoulder:230, elbow:242},
                  weaponAngle:292, legR:{hip:144,knee:162}, legL:{hip:214,knee:190}, hipBob:-3 }),
  windupLow:  P({ lean:-4, headTilt:2, armR:{shoulder:198, elbow:228}, armL:{shoulder:224, elbow:236},
                  weaponAngle:214, legR:{hip:150,knee:164}, legL:{hip:212,knee:188}, hipBob:-2 }),

  /* --- strikes --- */
  strikeDown:   P({ lean:20, headTilt:-6, armR:{shoulder:125, elbow:150}, armL:{shoulder:250, elbow:230},
                    weaponAngle:135, legR:{hip:130,knee:150}, legL:{hip:220,knee:195}, hipBob:2 }),
  strikeAcross: P({ lean:14, headTilt:0, armR:{shoulder:84, elbow:104}, armL:{shoulder:254, elbow:234},
                    weaponAngle:100, legR:{hip:135,knee:155}, legL:{hip:215,knee:190} }),
  strikeUp:     P({ lean:-2, headTilt:-4, armR:{shoulder:54, elbow:26}, armL:{shoulder:246, elbow:226},
                    weaponAngle:18, legR:{hip:145,knee:162}, legL:{hip:212,knee:188} }),
  thrust:       P({ lean:22, headTilt:-4, armR:{shoulder:92, elbow:92}, armL:{shoulder:242, elbow:250},
                    weaponAngle:92, legR:{hip:120,knee:145}, legL:{hip:226,knee:200}, hipBob:5 }),
  sweepLow:     P({ lean:26, headTilt:4, armR:{shoulder:140, elbow:166}, armL:{shoulder:250, elbow:240},
                    weaponAngle:158, legR:{hip:115,knee:138}, legL:{hip:226,knee:206}, hipBob:15 }),
  spinSlash:    P({ lean:8, headTilt:0, armR:{shoulder:92, elbow:118}, armL:{shoulder:276, elbow:256},
                    weaponAngle:108, legR:{hip:150,knee:166}, legL:{hip:212,knee:188} }),

  /* --- defenses --- */
  blockHigh: P({ lean:-6, headTilt:3, armR:{shoulder:46, elbow:62}, armL:{shoulder:82, elbow:58},
                 weaponAngle:276, legR:{hip:170,knee:178}, legL:{hip:198,knee:182} }),
  blockMid:  P({ lean:-4, headTilt:2, armR:{shoulder:80, elbow:46}, armL:{shoulder:100, elbow:70},
                 weaponAngle:8, legR:{hip:166,knee:176}, legL:{hip:200,knee:184} }),
  blockLow:  P({ lean:7, headTilt:3, armR:{shoulder:128, elbow:122}, armL:{shoulder:140, elbow:138},
                 weaponAngle:170, legR:{hip:156,knee:166}, legL:{hip:206,knee:190}, hipBob:7 }),
  parry:     P({ lean:-3, headTilt:1, armR:{shoulder:74, elbow:52}, armL:{shoulder:214, elbow:220},
                 weaponAngle:346, legR:{hip:164,knee:176}, legL:{hip:200,knee:184} }),
  riposte:   P({ lean:16, headTilt:-3, armR:{shoulder:96, elbow:86}, armL:{shoulder:230, elbow:240},
                 weaponAngle:88, legR:{hip:130,knee:152}, legL:{hip:220,knee:196}, hipBob:3 }),
  deflect:   P({ lean:-6, headTilt:-4, armR:{shoulder:70, elbow:40}, armL:{shoulder:212, elbow:218},
                 weaponAngle:354, legR:{hip:162,knee:174}, legL:{hip:202,knee:184} }),

  /* --- movement --- */
  duck:    P({ lean:24, headTilt:7, armR:{shoulder:140, elbow:150}, armL:{shoulder:226, elbow:214},
               weaponAngle:150, legR:{hip:130,knee:118}, legL:{hip:216,knee:216}, hipBob:27 }),
  leap:    P({ lean:-2, headTilt:-3, armR:{shoulder:34, elbow:8}, armL:{shoulder:230, elbow:250},
               weaponAngle:330, legR:{hip:124,knee:68}, legL:{hip:150,knee:80}, hipBob:-7 }),
  flipAir: P({ lean:0, headTilt:0, armR:{shoulder:18, elbow:358}, armL:{shoulder:250, elbow:270},
               weaponAngle:314, legR:{hip:110,knee:48}, legL:{hip:132,knee:60}, hipBob:-5 }),
  land:    P({ lean:17, headTilt:2, armR:{shoulder:116, elbow:80}, armL:{shoulder:240, elbow:230},
               weaponAngle:62, legR:{hip:140,knee:128}, legL:{hip:212,knee:206}, hipBob:21 }),
  kick:    P({ lean:-13, headTilt:-2, armR:{shoulder:40, elbow:14}, armL:{shoulder:230, elbow:200},
               weaponAngle:20, legR:{hip:78,knee:88}, legL:{hip:212,knee:192}, hipBob:-7 }),
  spinKick:P({ lean:-16, headTilt:-3, armR:{shoulder:24, elbow:352}, armL:{shoulder:280, elbow:300},
               weaponAngle:308, legR:{hip:62,knee:72}, legL:{hip:206,knee:188}, hipBob:-9 }),

  /* --- saber lock --- */
  lockPush:    P({ lean:16, headTilt:-2, armR:{shoulder:95, elbow:80}, armL:{shoulder:110, elbow:90},
                   weaponAngle:90, legR:{hip:140,knee:160}, legL:{hip:225,knee:200} }),
  lockStrainF: P({ lean:23, headTilt:-4, armR:{shoulder:98, elbow:86}, armL:{shoulder:112, elbow:94},
                   weaponAngle:94, legR:{hip:128,knee:150}, legL:{hip:232,knee:208}, hipBob:5 }),
  lockStrainB: P({ lean:-7, headTilt:5, armR:{shoulder:86, elbow:70}, armL:{shoulder:102, elbow:84},
                   weaponAngle:84, legR:{hip:160,knee:172}, legL:{hip:214,knee:196}, hipBob:3 }),

  /* --- reactions --- */
  stagger:   P({ lean:-18, headTilt:9, armR:{shoulder:220, elbow:245}, armL:{shoulder:250, elbow:200},
                 weaponAngle:250, legR:{hip:170,knee:130}, legL:{hip:220,knee:200}, hipBob:6 }),
  knockback: P({ lean:-24, headTilt:12, armR:{shoulder:245, elbow:275}, armL:{shoulder:285, elbow:235},
                 weaponAngle:274, legR:{hip:155,knee:115}, legL:{hip:232,knee:212}, hipBob:8 }),
  wounded:   P({ lean:19, headTilt:9, armR:{shoulder:170, elbow:186}, armL:{shoulder:156, elbow:140},
                 weaponAngle:176, legR:{hip:150,knee:146}, legL:{hip:210,knee:196}, hipBob:15 }),
  exhausted: P({ lean:23, headTilt:11, armR:{shoulder:176, elbow:190}, armL:{shoulder:196, elbow:200},
                 weaponAngle:182, legR:{hip:158,knee:154}, legL:{hip:206,knee:190}, hipBob:13 }),

  /* --- force / flourish --- */
  forceCast: P({ lean:-3, headTilt:-2, armR:{shoulder:304, elbow:300}, armL:{shoulder:94, elbow:84},
                 weaponAngle:284, legR:{hip:150,knee:168}, legL:{hip:215,knee:192} }),
  forcePull: P({ lean:9, headTilt:0, armR:{shoulder:298, elbow:294}, armL:{shoulder:126, elbow:158},
                 weaponAngle:280, legR:{hip:152,knee:168}, legL:{hip:212,knee:190} }),
  taunt:     P({ lean:-6, headTilt:-9, armR:{shoulder:40, elbow:350}, armL:{shoulder:300, elbow:320},
                 weaponAngle:8, legR:{hip:172,knee:180}, legL:{hip:196,knee:183}, hipBob:-3 }),

  /* --- resolutions --- */
  disarmWin:  P({ lean:11, headTilt:-3, armR:{shoulder:100, elbow:94}, armL:{shoulder:224, elbow:234},
                  weaponAngle:94, legR:{hip:146,knee:164}, legL:{hip:212,knee:190} }),
  disarmLose: P({ lean:-11, headTilt:9, armR:{shoulder:332, elbow:320}, armL:{shoulder:302, elbow:292},
                  weaponExtend:0, weaponAngle:330, legR:{hip:176,knee:180}, legL:{hip:198,knee:186} }),
  finishWin:  P({ lean:2, headTilt:0, armR:{shoulder:150, elbow:170}, armL:{shoulder:195, elbow:200},
                  weaponAngle:160, weaponExtend:1, legR:{hip:170,knee:179}, legL:{hip:192,knee:182} }),
  finishLose: P({ lean:28, headTilt:14, armR:{shoulder:186, elbow:206}, armL:{shoulder:208, elbow:196},
                  weaponAngle:200, weaponExtend:0.45, legR:{hip:140,knee:118}, legL:{hip:206,knee:168}, hipBob:14 }),
  kneel:      P({ lean:15, headTilt:8, armR:{shoulder:172, elbow:186}, armL:{shoulder:200, elbow:200},
                  weaponAngle:178, weaponExtend:0.7, legR:{hip:140,knee:110}, legL:{hip:215,knee:250}, hipBob:32 }),
  // Knocked flat and propped on the elbows. A truly prone figure isn't
  // expressible on a hip-pivot rig — rotating the body swings the legs
  // straight through the floor — so the fall resolves into a sprawl.
  deathFall:  P({ lean:-48, headTilt:10, hipBob:58,
                  armR:{shoulder:196, elbow:210}, armL:{shoulder:246, elbow:236},
                  weaponAngle:190, weaponExtend:0,
                  legR:{hip:95, knee:110}, legL:{hip:100, knee:108} }),

  /* --- signature guards -------------------------------------------------
     A duelist is recognisable standing still, and until now every fighter
     stood in the same one. These are resolved per fighter at playback by
     `poseFor` — the generator still just says 'guard'.

     Soresu   tight and bladed away, sabre vertical, elbows in — all defence
     Djem So  sabre high and back over the shoulder, weight forward — power
     Ataru    coiled low, sabre trailing, knees deep — ready to leave the floor
     Makashi  side-on fencer, one hand, off hand at the small of the back
     Juyo     open and unorthodox, sabre low and wide, chin up
     Whirl    both blades out horizontal, arms wide (four-armed styling)
     Brawl    the blunt weapons — bat on the shoulder, no technique at all  */
  guardSoresu:  P({ lean:3, headTilt:-1, armR:{shoulder:118, elbow:38},
                    weaponAngle:2, legR:{hip:162,knee:174}, legL:{hip:200,knee:184}, hipBob:3 }),
  guardDjemSo:  P({ lean:11, headTilt:-3, armR:{shoulder:348, elbow:316},
                    weaponAngle:318, legR:{hip:146,knee:166}, legL:{hip:212,knee:190}, hipBob:4 }),
  guardAtaru:   P({ lean:14, headTilt:-4, armR:{shoulder:128, elbow:66},
                    weaponAngle:24, legR:{hip:140,knee:154}, legL:{hip:218,knee:198}, hipBob:12 }),
  guardMakashi: P({ lean:0, headTilt:-6, grip:0, armR:{shoulder:126, elbow:74},
                    armL:{shoulder:238, elbow:288}, weaponAngle:52,
                    legR:{hip:158,knee:176}, legL:{hip:198,knee:180} }),
  guardJuyo:    P({ lean:-4, headTilt:5, armR:{shoulder:112, elbow:134},
                    weaponAngle:142, legR:{hip:150,knee:166}, legL:{hip:208,knee:186}, hipBob:2 }),
  guardWhirl:   P({ lean:6, grip:0, armR:{shoulder:96, elbow:116}, armL:{shoulder:264, elbow:244},
                    weaponAngle:126, weaponAngleL:236,
                    legR:{hip:152,knee:170}, legL:{hip:206,knee:186} }),
  guardBrawl:   P({ lean:4, grip:0, armR:{shoulder:20, elbow:330}, armL:{shoulder:196, elbow:204},
                    weaponAngle:300, legR:{hip:164,knee:176}, legL:{hip:200,knee:184}, hipBob:2 }),

  /* --- the stare --------------------------------------------------------
     Squared up, sabre lowered, chin level. Half of what a screen duel is
     made of is the beat where neither of them moves. */
  standoff:  P({ lean:2, headTilt:-3, armR:{shoulder:140, elbow:150},
                 weaponAngle:152, legR:{hip:166,knee:178}, legL:{hip:198,knee:182}, hipBob:1 }),

  /* --- ground work ------------------------------------------------------
     `rot` pivots about the hip, so a genuinely prone figure would swing its
     legs through the floor. A roll therefore drops hipHeight in the pose and
     tucks the limbs in, and lets `rot` carry only the spin — the same
     compromise `deathFall` makes. */
  rollTuck: P({ lean:40, headTilt:20, hipBob:46, grip:0.5,
                armR:{shoulder:150, elbow:200}, armL:{shoulder:210, elbow:250},
                weaponAngle:190, legR:{hip:110,knee:60}, legL:{hip:120,knee:66} }),
  rollUp:   P({ lean:18, headTilt:4, hipBob:26,
                armR:{shoulder:120, elbow:70}, weaponAngle:30,
                legR:{hip:132,knee:104}, legL:{hip:214,knee:236} }),

const POSE_ANGLE_KEYS = ['lean','headTilt','weaponAngle','weaponAngleL'];
const POSE_LINEAR_KEYS = ['rot','hipBob','weaponExtend','grip'];
const POSE_JOINTS = [['armR','shoulder'],['armR','elbow'],['armL','shoulder'],['armL','elbow'],
                     ['legR','hip'],['legR','knee'],['legL','hip'],['legL','knee']];

function lerpPose(a, b, t){
  const out = { armR:{}, armL:{}, legR:{}, legL:{} };
  for(const k of POSE_ANGLE_KEYS) out[k] = lerpAngle(a[k], b[k], t);
  for(const k of POSE_LINEAR_KEYS) out[k] = lerp(a[k], b[k], t);
  for(const [g,k] of POSE_JOINTS) out[g][k] = lerpAngle(a[g][k], b[g][k], t);
  return out;
}

/* ============================== CANVAS ==============================
   Sized against the PANEL, never the viewport. The engine ships as an
   embedded element, so `window.innerWidth` is the wrong number in the
   only deployment that matters.
*/
/* `state` is a const declared much further down, and `typeof` does NOT
   dodge the temporal dead zone — reading it from resize() during the first
   call throws before the engine ever starts. A plain flag does. */
let booted = false;

const panel = document.getElementById('duelPanel');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0, H=0, DPR=1, rigScale=1, groundY=0, spaceScale=1;
const prefersReducedMotion = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize(){
  const box = panel.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = Math.max(1, Math.round(box.width));
  H = Math.max(1, Math.round(box.height));
  canvas.width = Math.max(1, Math.round(W*DPR));
  canvas.height = Math.max(1, Math.round(H*DPR));
  ctx.setTransform(DPR,0,0,DPR,0,0);
  rigScale = clamp(H/620, 0.44, 1.3);
  // The arena has to respect the SHORT edge too. A 1600x360 letterbox with
  // width-only scaling puts two small figures a thousand pixels apart, which
  // reads as two people ignoring each other rather than as a duel.
  spaceScale = clamp(Math.min(W/1180, (H/620)*1.8), 0.26, 1.15);
  groundY = H*0.76;
  // Assigning canvas.width WIPES the buffer, and the loop may not be running
  // to put anything back — it parks when the panel scrolls off-screen, when
  // the tab is hidden, and in any automated browser. Resizing in any of
  // those states left a blank panel until something else happened to
  // repaint. Redraw here instead of waiting for a frame that may not come.
  if(booted) render(0);
}

if(window.ResizeObserver){
  new ResizeObserver(resize).observe(panel);
} else {
  window.addEventListener('resize', resize);
}
resize();

/* Off-screen panels stop costing anything. A background element on
   someone's homepage must not run a canvas the reader has scrolled past. */
let panelVisible = true;
if(window.IntersectionObserver){
  new IntersectionObserver(function(entries){
    for(const e of entries) panelVisible = e.isIntersecting;
    if(!panelVisible) Sound.silenceHums();
  }, { threshold:0 }).observe(panel);
}

function worldX(off){ return W*0.5 + off*spaceScale; }

/* ============================== AUDIO ==============================
   Everything is synthesised — no external assets, nothing to host. Starts
   MUTED and the context is not constructed until the first gesture, which
   is both the autoplay policy and the correct default for a background
   panel. The public API (clash, ignite, boom, bodyHit, landing, zap, force,
   hum) is the seam: swapping the internals for recorded buffers later means
   touching nothing outside this module.

   Signal path:  voice -> dry -> master -> out
                        \-> send -> convolver(room) -> master
                 sub bus is its own chain so big hits keep their low end
                 when the room reverb is short.
*/
const Sound = (function(){
  let ac=null, master=null, dry=null, send=null, room=null, noiseBuf=null;
  let ready=false, on=false;
  const hums=[], swings=[];

  function makeNoise(secs){
    const len = Math.floor(ac.sampleRate*(secs||1.2));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    return buf;
  }

  /* A procedural impulse: decaying filtered noise. One convolver, no asset,
     and the decay length is per-arena — a throne room rings, a desert does
     not. */
  function makeImpulse(secs, bright){
    const n = Math.floor(ac.sampleRate*secs);
    const buf = ac.createBuffer(2, n, ac.sampleRate);
    for(let ch=0; ch<2; ch++){
      const d = buf.getChannelData(ch);
      let lp = 0;
      for(let i=0;i<n;i++){
        const t = i/n;
        const raw = (Math.random()*2-1) * Math.pow(1-t, 2.4);
        lp += (raw - lp) * (0.06 + bright*0.5);
        d[i] = lp;
      }
    }
    return buf;
  }

  function build(){
    if(ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    dry = ac.createGain(); dry.gain.value = 0.92; dry.connect(master);
    room = ac.createConvolver(); room.buffer = makeImpulse(1.2, 0.35);
    const wet = ac.createGain(); wet.gain.value = 0.5;
    send = ac.createGain(); send.gain.value = 0.26;
    send.connect(room); room.connect(wet); wet.connect(master);
    noiseBuf = makeNoise();

    for(let i=0;i<2;i++){
      // --- the hum: two detuned saws, a sub sine, a second harmonic and an
      // LFO on the filter so it breathes instead of sitting still
      const g = ac.createGain(); g.gain.value = 0;
      const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
      const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=700; f.Q.value=5;
      const o1 = ac.createOscillator(); o1.type='sawtooth'; o1.frequency.value=94;
      const o2 = ac.createOscillator(); o2.type='sawtooth'; o2.frequency.value=99.5;
      const o3 = ac.createOscillator(); o3.type='sine';     o3.frequency.value=47;
      const o4 = ac.createOscillator(); o4.type='sine';     o4.frequency.value=188;
      const o4g = ac.createGain(); o4g.gain.value = 0.22;
      const lfo = ac.createOscillator(); lfo.type='sine'; lfo.frequency.value = 4.1 + i*0.7;
      const lfoG = ac.createGain(); lfoG.gain.value = 46;
      lfo.connect(lfoG); lfoG.connect(f.frequency);
      o1.connect(f); o2.connect(f); o3.connect(f); o4.connect(o4g); o4g.connect(f);
      f.connect(g);
      if(pan){ g.connect(pan); pan.connect(dry); pan.connect(send); }
      else { g.connect(dry); g.connect(send); }
      o1.start(); o2.start(); o3.start(); o4.start(); lfo.start();
      hums.push({g,f,pan,o1,o2,o3,o4});

      // --- the swing whoosh: one continuous noise voice per fighter, driven
      // by blade-tip speed. Panning by screen X gives doppler-ish movement
      // for nothing.
      const sg = ac.createGain(); sg.gain.value = 0;
      const sf = ac.createBiquadFilter(); sf.type='bandpass'; sf.frequency.value=700; sf.Q.value=1.1;
      const sp = ac.createStereoPanner ? ac.createStereoPanner() : null;
      const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      src.connect(sf); sf.connect(sg);
      if(sp){ sg.connect(sp); sp.connect(dry); sp.connect(send); }
      else { sg.connect(dry); sg.connect(send); }
      src.start();
      swings.push({g:sg, f:sf, pan:sp});
    }
    ready = true;
  }

  function burst(opts){
    if(!on || !ready) return;
    const t = ac.currentTime + (opts.at||0);
    const src = ac.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    src.playbackRate.value = opts.rate || 1;
    const f = ac.createBiquadFilter();
    f.type = opts.filter || 'bandpass';
    f.frequency.setValueAtTime(opts.f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(40, opts.f1), t+opts.dur);
    f.Q.value = opts.q || 1.2;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, opts.vol), t+(opts.atk||0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t+opts.dur);
    src.connect(f); f.connect(g); g.connect(dry);
    if(opts.wet !== 0) g.connect(send);
    src.start(t); src.stop(t+opts.dur+0.05);
  }

  function tone(opts){
    if(!on || !ready) return;
    const t = ac.currentTime + (opts.at||0);
    const o = ac.createOscillator();
    o.type = opts.type || 'sine';
    o.frequency.setValueAtTime(opts.f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.f1), t+opts.dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, opts.vol), t+(opts.atk||0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t+opts.dur);
    o.connect(g); g.connect(dry);
    if(opts.wet !== 0) g.connect(send);
    o.start(t); o.stop(t+opts.dur+0.05);
  }

  /* the 3–6ms metallic transient that makes a clash sound like metal rather
     than like a filtered noise gate opening */
  function ting(f0, vol, at){
    if(!on || !ready) return;
    const t = ac.currentTime + (at||0);
    const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f0; bp.Q.value=14;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.055);
    for(let i=0;i<3;i++){
      const o = ac.createOscillator();
      o.type = 'square';
      o.frequency.value = f0*(1 + i*0.41) * (0.97 + Math.random()*0.06);
      o.connect(bp); o.start(t); o.stop(t+0.06);
    }
    bp.connect(g); g.connect(dry); g.connect(send);
  }

  return {
    isOn(){ return on; },
    toggle(){
      build();
      if(!ready) return false;
      on = !on;
      if(on && ac.state === 'suspended') ac.resume();
      master.gain.setTargetAtTime(on ? 0.5 : 0, ac.currentTime, 0.05);
      // the room is set per fight, so without this, enabling sound mid-fight
      // played the default room until the next one — up to half a minute
      if(on && state && state.fight) this.setRoom(state.fight.arenaKey);
      return on;
    },
    /* Per-arena room. Long for the throne room and the temple, short in the
       open — the reverb is most of what tells you where you are. */
    setRoom(arenaKey){
      if(!ready) return;
      const LONG  = { throne:2.6, temple:2.4, hell:2.2, space:1.9, city:1.7, matrix:1.6 };
      const SHORT = { desert:0.5, dunes:0.5, swamp:0.7, suburb:0.8, snow:0.9, peak:1.1 };
      const secs = LONG[arenaKey] || SHORT[arenaKey] || 1.2;
      room.buffer = makeImpulse(secs, secs > 1.8 ? 0.22 : 0.4);
      send.gain.setTargetAtTime(secs > 1.8 ? 0.34 : 0.2, ac.currentTime, 0.2);
    },
    /* speed 0..1 normalised blade-tip velocity; screenX 0..1 for the pan */
    hum(i, speed, char, screenX){
      if(!on || !ready || !hums[i]) return;
      const h = hums[i], s = swings[i], t = ac.currentTime;
      // pitch derives from the fighter's own scale, as every colour derives
      // from the palette — small fighters hum high
      const pitch = clamp(1/(char.scale||1), 0.72, 1.55);
      h.o1.frequency.setTargetAtTime(94*pitch, t, 0.3);
      h.o2.frequency.setTargetAtTime(99.5*pitch, t, 0.3);
      h.o3.frequency.setTargetAtTime(47*pitch, t, 0.3);
      h.o4.frequency.setTargetAtTime(188*pitch, t, 0.3);
      h.g.gain.setTargetAtTime(0.035 + speed*0.16, t, 0.05);
      h.f.frequency.setTargetAtTime(420 + speed*2600, t, 0.04);
      const pan = clamp((screenX-0.5)*1.7, -1, 1);
      if(h.pan) h.pan.pan.setTargetAtTime(pan, t, 0.08);
      // the whoosh only exists while the blade is actually moving
      const sw = Math.max(0, speed-0.16)/0.84;
      s.g.gain.setTargetAtTime(sw*sw*0.20, t, 0.035);
      s.f.frequency.setTargetAtTime(360 + sw*2600, t, 0.03);
      s.f.Q.setTargetAtTime(0.8 + sw*1.6, t, 0.05);
      if(s.pan) s.pan.pan.setTargetAtTime(pan, t, 0.06);
    },
    silenceHums(){
      if(!ready) return;
      const t = ac.currentTime;
      for(const h of hums) h.g.gain.setTargetAtTime(0, t, 0.08);
      for(const s of swings) s.g.gain.setTargetAtTime(0, t, 0.08);
    },

    /* --- impacts ------------------------------------------------------- */
    /* Three layers, because one filtered burst is a hiss and not a hit:
       a metallic transient, a bandpassed body sweeping down, and a sub
       thump. Everything is detuned ±15% per hit — repetition is the tell. */
    clash(power){
      const v = 0.85 + Math.random()*0.3;
      ting((2400 + power*2600)*v, 0.05 + power*0.07, 0);
      burst({ f0:(2600+power*2200)*v, f1:520*v, dur:0.16+power*0.12,
              vol:0.14+power*0.19, q:0.9, atk:0.004 });
      tone({ type:'sine', f0:92*v, f1:40, dur:0.13+power*0.1, vol:0.10+power*0.14, atk:0.003 });
    },
    /* Grains scattered over the tail of a clash. The count follows the spark
       count, so a 34-spark finisher sizzles longer than a 9-spark flurry. */
    sizzle(sparkCount){
      if(!on || !ready) return;
      const n = clamp(Math.round(sparkCount*1.1), 6, 40);
      for(let i=0;i<n;i++){
        burst({ at: 0.02 + Math.random()*(0.24 + sparkCount*0.008),
                f0: 5200 + Math.random()*4200, f1: 2600, dur: 0.02 + Math.random()*0.045,
                vol: 0.012 + Math.random()*0.026, q: 5, atk:0.002, rate: 0.8+Math.random()*0.7 });
      }
    },
    /* The sidechained low end. Most of what makes a heavy blow feel heavy is
       here and not in the transient. */
    sub(power){
      tone({ type:'sine', f0:60, f1:28, dur:0.4 + power*0.32,
             vol:0.16 + power*0.26, atk:0.012, wet:0 });
    },
    ignite(){
      burst({f0:180, f1:2400, dur:0.34, vol:0.18, q:1.4});
      tone({type:'sawtooth', f0:70, f1:360, dur:0.3, vol:0.07});
    },
    boom(){
      tone({type:'sine', f0:150, f1:32, dur:0.75, vol:0.3});
      burst({filter:'lowpass', f0:900, f1:90, dur:0.5, vol:0.18});
    },
    /* three different weights, where there used to be one `thud` */
    bodyHit(power){
      tone({type:'sine', f0:170, f1:58, dur:0.2, vol:0.13+power*0.1, atk:0.004});
      burst({filter:'lowpass', f0:1300, f1:220, dur:0.12, vol:0.10+power*0.08, atk:0.003});
    },
    landing(power){
      tone({type:'sine', f0:110, f1:38, dur:0.34, vol:0.16+power*0.12, atk:0.006});
      burst({filter:'lowpass', f0:620, f1:110, dur:0.24, vol:0.12, q:0.7});
    },
    kneel(){
      tone({type:'sine', f0:96, f1:44, dur:0.42, vol:0.13, atk:0.02});
      burst({filter:'lowpass', f0:420, f1:90, dur:0.3, vol:0.07});
    },
    /* energy: a rising pressure whoomph with a wide sweep, not a zap */
    force(){
      burst({filter:'lowpass', f0:120, f1:1700, dur:0.44, vol:0.2, q:0.6, atk:0.05});
      tone({type:'sine', f0:44, f1:150, dur:0.5, vol:0.2, atk:0.06, wet:0});
    },
    whoomph(){
      burst({filter:'bandpass', f0:300, f1:1500, dur:0.3, vol:0.15, q:0.8, atk:0.03});
      tone({type:'sine', f0:70, f1:130, dur:0.34, vol:0.14, atk:0.03, wet:0});
    },
    /* lightning: crackle grains rather than a single high burst */
    zap(scale){
      const s = scale === undefined ? 1 : scale;
      burst({f0:4200, f1:900, dur:0.24*s, vol:0.11*s, q:3});
      const n = Math.round(10*s);
      for(let i=0;i<n;i++){
        burst({ at: Math.random()*0.26, f0: 3000+Math.random()*5000, f1: 1400,
                dur: 0.012+Math.random()*0.03, vol: 0.014+Math.random()*0.03, q:8, atk:0.001 });
      }
    },
    thud(){ this.bodyHit(0.5); }
  };
})();

/* ============================== PARTICLES ============================== */
let particles = [];
const MAX_PARTICLES = 460;

/* Sparks come off struck metal along the contact normal, in two opposed
   lobes — not radially. `norm` is that axis in radians; without it the old
   uniform spray is kept for anything with no meaningful direction. They also
   bounce off the floor, which is what stops them reading as a firework. */
function emitSpark(x, y, colorA, colorB, count, power, norm){
  if(particles.length > MAX_PARTICLES) return;
  for(let i=0;i<count;i++){
    const a = norm === undefined
      ? rand(0,TAU)
      : norm + (chance(0.5) ? 0 : Math.PI) + rand(-0.62, 0.62);
    const sp = rand(70, 200 + 260*(power||0.4));
    particles.push({
      x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - rand(0,110),
      life:0, maxLife:rand(0.22,0.62),
      color: chance(0.5)?colorA:colorB, size:rand(1.4,3.4), grav:240,
      type:'spark', bounce:true
    });
  }
}
function emitRing(x, y, color, count){
  if(particles.length > MAX_PARTICLES) return;
  for(let i=0;i<count;i++){
    const a = (i/count)*TAU + rand(-0.08,0.08);
    const sp = rand(200,420);
    particles.push({
      x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*0.55,
      life:0, maxLife:rand(0.3,0.6),
      color, size:rand(1.6,3.2), grav:40, type:'spark'
    });
  }
}
function emitDust(x, y, color, count){
  if(particles.length > MAX_PARTICLES) return;
  for(let i=0;i<count;i++){
    particles.push({
      x:x+rand(-24,24), y:y+rand(-4,4),
      vx:rand(-70,70), vy:-rand(10,70),
      life:0, maxLife:rand(0.4,0.9),
      color, size:rand(1.2,3.0), grav:90, type:'dust'
    });
  }
}

let ambientTimer = 0;
function updateAmbient(dt, arena){
  ambientTimer += dt;
  const kind = arena.ambient;
  const interval = (kind==='rain') ? 0.03 : (kind==='snow') ? 0.09 : (kind==='fog') ? 0.5 : 0.2;
  const cap = (kind==='rain') ? 150 : (kind==='snow') ? 110 : (kind==='fog') ? 26 : 52;
  let ambientCount = 0;
  for(const p of particles) if(p.type==='ambient') ambientCount++;
  while(ambientTimer > interval && ambientCount < cap){
    ambientTimer -= interval;
    ambientCount++;
    let p;
    if(kind==='embers'){
      p = { x:rand(0,W), y:H+10, vx:rand(-10,10), vy:-rand(16,44), maxLife:rand(3,7), size:rand(0.9,2.4) };
    } else if(kind==='rain'){
      p = { x:rand(-60,W), y:-20, vx:rand(120,190), vy:rand(680,900), maxLife:rand(0.7,1.1), size:rand(0.7,1.5), streak:true };
    } else if(kind==='snow'){
      p = { x:rand(0,W), y:-15, vx:rand(-16,26), vy:rand(24,58), maxLife:rand(5,9), size:rand(1.0,2.6) };
    } else if(kind==='fog'){
      p = { x:rand(0,W), y:rand(H*0.45,H*0.92), vx:rand(-9,9), vy:rand(-3,3), maxLife:rand(5,10), size:rand(16,44), soft:true };
    } else if(kind==='dust'){
      p = { x:rand(0,W), y:rand(0,H), vx:rand(-14,14), vy:rand(-12,4), maxLife:rand(3,7), size:rand(0.8,2.2) };
    } else { // stars
      p = { x:rand(0,W), y:rand(0,H), vx:rand(-4,4), vy:rand(-3,3), maxLife:rand(4,9), size:rand(0.7,2.0) };
    }
    p.life = 0; p.grav = 0; p.type = 'ambient';
    p.color = arena.ambientColor; p.tw = rand(0,TAU);
    particles.push(p);
  }
  if(ambientTimer > 2) ambientTimer = 0;
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life += dt;
    if(p.life > p.maxLife || p.y > H+80){ particles.splice(i,1); continue; }
    p.vy += (p.grav||0)*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.bounce && p.y > groundY && p.vy > 0){
      p.y = groundY; p.vy *= -0.42; p.vx *= 0.7;
      if(Math.abs(p.vy) < 26){ p.bounce = false; p.grav = 0; p.vx *= 0.3; }
    }
  }
}

/* ============================== SCORCH DECALS ==============================
   Plasma touching stone leaves something behind. Decals sit under the
   fighters and cool white -> orange -> dark over ~2s, which also quietly
   records where the fight has been. */
const decals = [];
const MAX_DECALS = 26;
function addDecal(x, y, heat){
  if(prefersReducedMotion) return;
  decals.push({ x, y:y + rand(-2,3), r:rand(9,20)*(0.7+heat), born:0,
                life:rand(1.7,2.6), heat:clamp(heat,0.15,1), skew:rand(0.22,0.4) });
  while(decals.length > MAX_DECALS) decals.shift();
}
function updateDecals(dt){
  for(let i=decals.length-1;i>=0;i--){
    decals[i].born += dt;
    if(decals[i].born > decals[i].life) decals.splice(i,1);
  }
}
function drawDecals(){
  if(!decals.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const d of decals){
    const t = d.born/d.life;
    // white -> orange -> ember -> nothing, ADDITIVE so it reads as heat on
    // the floor. Painted normally it darkened the ground into what looked
    // like a second ground shadow, which is the opposite of a scorch.
    const g = Math.round(lerp(236, 52, Math.min(1, t*1.5)));
    const b = Math.round(lerp(200, 8, Math.min(1, t*1.1)));
    ctx.globalAlpha = (1-t)*(1-t)*0.5*d.heat;
    ctx.fillStyle = 'rgb(255,'+g+','+b+')';
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.r*(1+t*0.6), d.r*d.skew, 0, 0, TAU);
    ctx.fill();
    if(t < 0.25){   // the bright core, only while it is genuinely hot
      ctx.globalAlpha = (1 - t/0.25)*0.4*d.heat;
      ctx.fillStyle = '#fff3d8';
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, d.r*0.42, d.r*d.skew*0.6, 0, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}

/* ============================== BLASTER BOLTS ==============================
   A volley arrives from off-stage and both duelists deflect it. That needs
   no sidearm, no new rig and no new generator path — a bolt is a particle
   with a stop line, and `deflect` is a pose the engine already has. */
const bolts = [];
const MAX_BOLTS = 40;
function fireVolley(beat){
  const b = beat.bolts;
  const fromLeft = b.from < 0;
  // The bolt stops at whoever is deflecting it, read live — the beat was
  // authored in world units and the panel decides what those are in pixels.
  const stop = propX(b.who);
  for(let i=0;i<b.n && bolts.length < MAX_BOLTS;i++){
    const y = groundY - rand(60, 190)*rigScale;
    bolts.push({
      x: fromLeft ? -30 : W+30, y,
      vx: (fromLeft ? 1 : -1) * rand(1150, 1500),
      vy: rand(-24, 24),
      stopX: stop + rand(-16, 16),
      color: b.color, delay: i*rand(0.05, 0.13),
      len: rand(22, 34), deflected:false, life:0
    });
  }
}
function updateBolts(dt){
  for(let i=bolts.length-1;i>=0;i--){
    const p = bolts[i];
    if(p.delay > 0){ p.delay -= dt; continue; }
    p.life += dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(!p.deflected && (p.vx > 0 ? p.x >= p.stopX : p.x <= p.stopX)){
      // deflected: sent off at a new angle, with sparks off the blade
      // sent back the way it came, angled up off the blade
      p.deflected = true;
      const back = p.vx > 0 ? -1 : 1;
      const a = rand(0.35, 1.25);
      const sp = rand(900, 1400);
      p.vx = back*Math.cos(a)*sp;
      p.vy = -Math.sin(a)*sp;
      emitSpark(p.x, p.y, p.color, '#ffffff', 7, 0.5);
      Sound.zap(0.5);
    }
    if(p.life > 2.4 || p.x < -140 || p.x > W+140 || p.y < -120) bolts.splice(i,1);
  }
}
function drawBolts(){
  if(!bolts.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for(const p of bolts){
    if(p.delay > 0) continue;
    const d = Math.hypot(p.vx, p.vy) || 1;
    const tx = p.x - p.vx/d*p.len, ty = p.y - p.vy/d*p.len;
    ctx.strokeStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 12;
    ctx.globalAlpha = 0.55; ctx.lineWidth = 5.5;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.lineWidth = 1.9;
    ctx.strokeStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(tx,ty); ctx.stroke();
  }
  ctx.restore();
}

/* ============================== THROWN PROPS ==============================
   Lifted, hovered, hurled, then cut in half or eaten. Props are drawn as
   flat polygons in the arena's own darkness so they read as scenery that
   came loose rather than as a new art style arriving. */
const props = [];
const PROP_SHAPES = {
  rock:    [[-16,10],[-10,-9],[3,-14],[15,-4],[12,11]],
  crate:   [[-15,-13],[15,-13],[15,13],[-15,13]],
  pillar:  [[-11,-26],[11,-26],[13,24],[-13,24]],
  console: [[-19,-10],[19,-14],[17,12],[-17,12],[-14,2]],
  slab:    [[-24,-7],[24,-11],[22,10],[-22,8]]
};
const PROP_KEYS = Object.keys(PROP_SHAPES);

/* Props are positioned from the LIVE fighter positions, not from anything
   baked in at generation time — the arena is a different number of pixels
   wide on every panel it lands in. */
function propX(who){
  return who === 'A' ? worldX(state.baseXA + state.dxA)
                     : worldX(state.baseXB + state.dxB);
}
function propBeat(beat, cx){
  const p = beat.prop;
  if(p.act === 'lift'){
    const home = propX(p.who);
    props.push({
      kind: p.kind, x: lerp(home, cx, 0.4), y: groundY-6, vx:0, vy:0,
      rot:rand(-0.4,0.4), vrot:rand(-0.5,0.5),
      scale: (0.9 + Math.random()*0.5)*rigScale, phase:'lift', t:0,
      restY: groundY - rand(120,175)*rigScale, halves:null
    });
    Sound.force();
  } else if(p.act === 'hurl'){
    const it = props[props.length-1];
    if(!it) return;
    it.phase = 'fly'; it.t = 0;
    it.vx = (propX(p.who) - it.x)/0.42;
    it.vy = -rand(70, 150)*rigScale;
    it.vrot = rand(-5, 5);
    Sound.whoomph();
  } else if(p.act === 'cut'){
    const it = props[props.length-1];
    if(!it) return;
    it.phase = 'split'; it.t = 0;
    it.halves = [{ dx:0, dy:0, vx:-140, vy:-190, rot:0, vrot:-4 },
                 { dx:0, dy:0, vx: 140, vy:-150, rot:0, vrot: 4 }];
    emitSpark(it.x, it.y, beat.propColor||'#ffffff', '#ffffff', 22, 0.8);
    addDecal(it.x, groundY, 0.5);
  } else if(p.act === 'hit'){
    const it = props[props.length-1];
    if(!it) return;
    it.phase = 'burst'; it.t = 0;
    emitSpark(it.x, it.y, '#ffd8a0', '#ffffff', 20, 0.7);
    emitDust(it.x, groundY, '#b8a894', 12);
  }
}
function updateProps(dt){
  for(let i=props.length-1;i>=0;i--){
    const it = props[i];
    it.t += dt;
    if(it.phase === 'lift'){
      it.y = lerp(it.y, it.restY, 1-Math.exp(-dt*4.5));
      it.rot += it.vrot*dt*0.5;
      it.x += Math.sin(it.t*5.2)*8*dt;      // the wobble of something held
    } else if(it.phase === 'fly'){
      it.vy += 420*dt;
      it.x += it.vx*dt; it.y += it.vy*dt; it.rot += it.vrot*dt;
      if(it.y > groundY-4){ it.phase='burst'; it.t=0; emitDust(it.x, groundY, '#b8a894', 10); }
    } else if(it.phase === 'split'){
      for(const h of it.halves){
        h.vy += 620*dt; h.dx += h.vx*dt; h.dy += h.vy*dt; h.rot += h.vrot*dt;
      }
      if(it.t > 1.3) props.splice(i,1);
    } else if(it.phase === 'burst'){
      if(it.t > 0.45) props.splice(i,1);
    }
    if(props.length > 4) props.shift();
  }
}
function drawPropShape(kind, x, y, rot, scale, alpha){
  const s = PROP_SHAPES[kind] || PROP_SHAPES.rock;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.beginPath(); ctx.moveTo(s[0][0], s[0][1]);
  for(let i=1;i<s.length;i++) ctx.lineTo(s[i][0], s[i][1]);
  ctx.closePath();
  ctx.fillStyle = 'rgba(16,15,20,0.92)'; ctx.fill();
  ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(168,176,198,0.5)'; ctx.stroke();
  ctx.restore();
}
function drawProps(layer){
  for(const it of props){
    // hovering and flying props pass in FRONT; nothing sits behind yet, but
    // the split halves fall past the fighters' feet and belong behind them
    const front = it.phase !== 'split';
    if((layer === 'front') !== front) continue;
    if(it.phase === 'split'){
      for(const h of it.halves)
        drawPropShape(it.kind, it.x+h.dx, it.y+h.dy, it.rot+h.rot, it.scale,
                      clamp(1 - it.t/1.3, 0, 1));
    } else if(it.phase !== 'burst'){
      drawPropShape(it.kind, it.x, it.y, it.rot, it.scale, 1);
      if(it.phase === 'lift'){
        ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.16;
        ctx.fillStyle = '#8fa8ff';
        ctx.beginPath(); ctx.arc(it.x, it.y, 30*it.scale, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
  }
}

function drawParticles(filterType){
  for(const p of particles){
    const isAmb = p.type==='ambient';
    if(filterType==='ambient' && !isAmb) continue;
    if(filterType==='action' && isAmb) continue;
    const t = p.life/p.maxLife;
    ctx.save();
    if(p.soft){
      ctx.globalAlpha = 0.05*Math.sin(Math.PI*t);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    } else if(p.streak){
      ctx.globalAlpha = 0.22*(1-t*0.4);
      ctx.strokeStyle = p.color; ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx*0.022, p.y - p.vy*0.022); ctx.stroke();
    } else {
      // Normalise the twinkle to 0..1 before scaling: a raw sine here goes
      // negative, and the canvas silently ignores an out-of-range alpha.
      const twinkle = 0.5 + 0.5*Math.sin((p.tw||0) + p.life*2);
      ctx.globalAlpha = clamp(isAmb ? (0.10 + 0.32*twinkle)*(1-t) : (1-t), 0, 1);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = p.type==='spark' ? 9 : 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*(p.type==='spark' ? (1-t*0.6) : 1), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ============================== SHAKE / FLASH / CAMERA ============================== */
/* Shake is directional: a blow travelling left kicks the frame left. Random
   jitter on both axes reads as a rumble, which is the wrong note for a
   single struck sword. The axis is the blow's own, plus a little vertical
   so it is not a pure slide. */
let shakeT=0, shakeMag=0, shakeVX=0, shakeVY=0;
function triggerShake(mag, dur, axisX){
  if(prefersReducedMotion) return;
  shakeT = Math.max(shakeT, dur);
  shakeMag = Math.max(shakeMag, mag);
  if(axisX !== undefined){
    const s = axisX >= 0 ? 1 : -1;
    shakeVX = s*0.92; shakeVY = -0.38;
  } else { shakeVX = 0.7; shakeVY = -0.7; }
}

const flash = { color:'#ffffff', a:0, decay:3 };
function triggerFlash(color, strength, decay){
  flash.color = color || '#ffffff';
  flash.a = Math.max(flash.a, prefersReducedMotion ? strength*0.3 : strength);
  flash.decay = decay || 3;
}

const cam = { x:0, y:0, z:1, tx:0, ty:0, tz:1 };
function resetCamera(){
  cam.x = cam.tx = W*0.5;
  cam.y = cam.ty = H*0.55;
  cam.z = cam.tz = 1;
}

/* ============================== FIGURE DRAWING ============================== */

/* Per-fighter limb multipliers. Grievous is long-limbed, Homer is wide and
   short-legged, Yoda is already handled by `scale`. Anything absent falls
   back to the shared RIG, so a fighter with no `proportion` is untouched. */
function rigFor(char){
  const p = char.proportion;
  if(!p) return RIG;
  if(char._rig) return char._rig;
  const out = {};
  for(const k in RIG) out[k] = RIG[k] * (p[k] !== undefined ? p[k] : 1);
  return (char._rig = out);
}

/* Two-bone IK, solved in world space rather than in pose angles. Solving in
   angles would mean converting back through `pt`'s mirrored convention twice
   and re-deriving the elbow sign; positions are what the renderer wants
   anyway. Returns {el, ha}. */
function solveArm(sh, target, L1, L2){
  let dx = target.x - sh.x, dy = target.y - sh.y;
  let d = Math.hypot(dx, dy);
  const reach = L1 + L2;
  if(d < 0.001){ dx = 0; dy = L1; d = L1; }
  // Out of reach: point straight at the hilt and fall short. A hand floating
  // a few pixels shy of the grip reads fine; an unsolvable pop does not.
  if(d >= reach*0.999){
    const u = { x:dx/d, y:dy/d };
    return { el:{ x:sh.x+u.x*L1, y:sh.y+u.y*L1 },
             ha:{ x:sh.x+u.x*reach, y:sh.y+u.y*reach }, short:true };
  }
  const base = Math.atan2(dy, dx);
  const cosA = clamp((d*d + L1*L1 - L2*L2)/(2*d*L1), -1, 1);
  const a = Math.acos(cosA);
  // Two solutions; take the one with the lower elbow. That is the elbow-out,
  // elbow-down triangle a real two-handed grip makes, and it is the one that
  // can never fold the forearm through the chest.
  const e1 = { x:sh.x+Math.cos(base+a)*L1, y:sh.y+Math.sin(base+a)*L1 };
  const e2 = { x:sh.x+Math.cos(base-a)*L1, y:sh.y+Math.sin(base-a)*L1 };
  return { el: e1.y >= e2.y ? e1 : e2, ha:{ x:target.x, y:target.y } };
}

function computeJoints(x, yOff, dir, pose, char){
  const R = rigFor(char);
  const S = rigScale*(char.scale||1);
  const hip = { x, y: groundY - R.hipHeight*S + (pose.hipBob||0)*S + (yOff||0) };
  const neck = pt(hip, pose.lean, R.spine*S, dir);
  const head = pt(neck, pose.lean + pose.headTilt, (R.headR+8)*S, dir);
  const shR = pt(neck, 100, R.shoulderW*S, dir);
  const shL = pt(neck, 260, R.shoulderW*S, dir);
  const elR = pt(shR, pose.armR.shoulder, R.upperArm*S, dir);
  const haR = pt(elR, pose.armR.elbow, R.forearm*S, dir);
  let elL = pt(shL, pose.armL.shoulder, R.upperArm*S, dir);
  let haL = pt(elL, pose.armL.elbow, R.forearm*S, dir);
  const knR = pt(hip, pose.legR.hip, R.thigh*S, dir);
  const ftR = pt(knR, pose.legR.knee, R.shin*S, dir);
  const knL = pt(hip, pose.legL.hip, R.thigh*S, dir);
  const ftL = pt(knL, pose.legL.knee, R.shin*S, dir);

  /* --- the off hand ------------------------------------------------------
     A single blade held one-handed is the thing that made every duel read as
     amateur. `grip` is a 0..1 scalar so `lerpPose` can blend it, and the IK
     runs on the BLENDED pose — solving per keyframe and then blending would
     separate the hands mid-transition. */
  const twoHand = (char.weapon === 'dual' || char.offhand) ? 0 : clamp(pose.grip, 0, 1);
  if(twoHand > 0.002 && pose.weaponExtend > 0.08){
    // A staff is gripped along the shaft, not at the same point as the right
    // hand — that wide-arm hold is most of what a saberstaff looks like.
    const target = char.weapon === 'staff'
      ? pt(haR, pose.weaponAngle + 180, 30*S, dir)
      : haR;
    const ik = solveArm(shL, target, R.upperArm*S, R.forearm*S);
    elL = { x:lerp(elL.x, ik.el.x, twoHand), y:lerp(elL.y, ik.el.y, twoHand) };
    haL = { x:lerp(haL.x, ik.ha.x, twoHand), y:lerp(haL.y, ik.ha.y, twoHand) };
  }

  const j = {hip,neck,head,shR,shL,elR,haR,elL,haL,knR,ftR,knL,ftL,S,R,dir};

  const spin = (pose.rot||0) * dir;
  if(spin){
    const rad = spin*DEG;
    for(const k of ['neck','head','shR','shL','elR','haR','elL','haL','knR','ftR','knL','ftL']){
      j[k] = rotAround(j[k], hip, rad);
    }
  }
  return j;
}

function strokeLine(a, b, w, color, cap){
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
  ctx.lineWidth = w; ctx.strokeStyle = color; ctx.lineCap = cap||'round';
  ctx.stroke();
}

/* Several fighters are near-black by design (Vader, Neo, Batman). On a dark
   arena they vanish, so every figure gets an edge stroke whose colour is
   chosen against its own luminance — light rim on dark bodies, dark rim on
   light ones. Cached: this is per-fighter, not per-frame. */
const _lum = {};
function luminance(hex){
  if(_lum[hex] !== undefined) return _lum[hex];
  const h = hex.replace('#','');
  const r = parseInt(h.substr(0,2),16)/255;
  const g = parseInt(h.substr(2,2),16)/255;
  const b = parseInt(h.substr(4,2),16)/255;
  return (_lum[hex] = 0.2126*r + 0.7152*g + 0.0722*b);
}
function edgeColor(hex){
  return luminance(hex) < 0.32 ? 'rgba(164,174,201,0.55)' : 'rgba(0,0,0,0.42)';
}

/* A SECOND TONE, and it is what makes two beige Jedi in matching robes
   tell apart at 180px. Every costume mark used the one body colour, so
   Obi-Wan's beard, Anakin's hair and both their robes were the same value
   and merged into one shape. Head-region marks use this instead.

   Derived by pushing the body colour away from its own luminance — a dark
   fighter gets a lighter mark and a light one a darker mark — so every
   character gets the separation without per-character work. `char.mark`
   overrides it where the real answer is a specific colour (blond, black
   hair, a white beard). Cached per fighter; this is not per-frame work. */
function shade(hex, amt){
  const h = hex.replace('#','');
  const to = amt > 0 ? 255 : 0, k = Math.abs(amt);
  const ch = i => {
    const v = parseInt(h.substr(i,2),16);
    return Math.round(v + (to - v)*k).toString(16).padStart(2,'0');
  };
  return '#' + ch(0) + ch(2) + ch(4);
}
function markColor(char){
  if(char._mark) return char._mark;
  return (char._mark = char.mark ||
    shade(char.color, luminance(char.color) < 0.32 ? 0.42 : -0.52));
}

/* ============================== COSTUMES ==============================
   The requirement is recognition at 200–320px, mid-motion, on a reader who
   is looking at the page and not at the fight. That rules out faces. What
   survives at that size is SILHOUETTE, MASS and one signature shape.

   Two rules keep 29 characters looking like one set rather than a grab bag:

   1. Every costume is assembled from the six primitives below and nothing
      else. No costume reaches for ctx directly.
   2. Body-covering cloth hangs BEHIND the limbs, translucent, in the `back`
      slot. A filled quad between the arms is what turns two swordsmen into
      two slabs holding shields — it is the single failure this vocabulary
      exists to prevent, and the reason the torso itself stays a stroke.

   Slots, all called with (j, dir, S) per the handoff brief:
     back(j,dir,S)     before the legs — capes, coats, robes, extra limbs
     head(j,dir,S)     replaces the plain circle. Carries most of the read.
     torso(j,dir,S)    after the spine stroke — collars, belts, pads
     overlay(j,dir,S)  last — the signature accessory
*/
let D = null;   // current draw context, set once per figure by drawFigure

/* ONE UNIT RULE, and it is the only thing you need to remember to write a
   costume: every length and width a costume passes in is in RIG UNITS —
   the same units as RIG.headR and RIG.spine. Every primitive multiplies by
   D.S itself. Mixing pixels in here scales twice and the mark silently
   doubles on a retina display. `px(u)` is the escape hatch for the two
   costumes that reach for ctx directly. */
function px(u){ return u*D.S; }
function fillAs(c, a){ ctx.globalAlpha = a===undefined ? 1 : a; ctx.fillStyle = c||D.col; }

/* THE RIM. Several fighters are near-black by design — Vader, Batman, Neo,
   Sauron — and on a dark arena a black helmet on a black head is nothing at
   all. The skeleton has always had an edge pass; the costumes had not, so
   every mark on the characters who most needed one was invisible. Each
   primitive now lays its own rim under itself: stroke the path in the edge
   colour, then fill, so the fill covers the inner half of the stroke and
   what survives is a clean outline half a stroke wide.

   `bare` opts out, for marks that are already a contrasting colour (a white
   eye, a black visor) where a rim would only muddy them. */
function rimAndFill(fill, a, bare){
  if(!bare && D.edge){
    ctx.strokeStyle = D.edge;
    ctx.lineWidth = px(D.rimW);
    ctx.lineJoin = 'round';
    ctx.globalAlpha = a===undefined ? 1 : Math.max(a, 0.55);
    ctx.stroke();
  }
  fillAs(fill, a);
  ctx.fill();
}

/* 1. mass — an ellipse of body. Hair, egg bodies, hoods, beards. */
function mass(p, rx, ry, rot, fill, a, bare){
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, Math.abs(px(rx)), Math.abs(px(ry)), (rot||0)*DEG*D.dir, 0, TAU);
  rimAndFill(fill, a, bare);
  ctx.restore();
}
/* 2. plate — a filled polygon of already-solved points. Helmet flanges,
      lapels, shoulder pads, emblems, beard wedges. */
function plate(pts, fill, a, bare){
  if(!pts || pts.length < 3) return;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  rimAndFill(fill, a, bare);
  ctx.restore();
}
/* 3. rod — a stroked segment. Antennae, tails, moustaches, braids, staffs.
      A stroke cannot be filled over, so it gets its rim by being drawn
      twice: once fat in the edge colour, once at width. */
function rod(a, b, w, color, alpha, bare){
  ctx.save(); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
  if(!bare && D.edge){
    ctx.globalAlpha = alpha===undefined ? 1 : Math.max(alpha, 0.55);
    ctx.lineWidth = px(w) + px(D.rimW*0.85); ctx.strokeStyle = D.edge; ctx.stroke();
  }
  ctx.globalAlpha = alpha===undefined ? 1 : alpha;
  ctx.lineWidth = px(w); ctx.strokeStyle = color||D.col; ctx.stroke();
  ctx.restore();
}
/* 4. spray — n tapering spikes fanned from a point. The workhorse: hair,
      horns, crowns, montrals, ears, crests. Wobble is derived from the index
      and never from Math.random, or the hair boils on every frame. */
function spray(o, base, n, spread, len, w, color, jit){
  ctx.save(); ctx.lineCap='round';
  for(let pass=0; pass<2; pass++){
    if(pass===0 && !D.edge) continue;
    ctx.strokeStyle = pass===0 ? D.edge : (color||D.col);
    for(let i=0;i<n;i++){
      const f = n===1 ? 0.5 : i/(n-1);
      const wob = jit ? 1 + (((i*37)%7)-3)*0.045*jit : 1;
      const L = px(len) * (0.62 + 0.38*Math.sin(Math.PI*f)) * wob;
      const tip = pt(o, base + (f-0.5)*spread, L + (pass===0?px(1.4):0), D.dir);
      ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(tip.x,tip.y);
      ctx.lineWidth = px(w)*(1 - 0.25*f) + (pass===0 ? px(D.rimW*0.85) : 0);
      ctx.stroke();
    }
  }
  ctx.restore();
}
/* 5. drape — hanging cloth between two shoulder points and two hem points,
      with a soft belly so it reads as fabric and not as a sign. This is the
      ONLY way body-covering cloth enters a costume, and it is always called
      from the `back` slot so it can never swallow the limbs. */
function drape(t1, t2, b1, b2, fill, a, belly){
  ctx.save(); fillAs(fill, a===undefined ? 0.42 : a);
  ctx.beginPath();
  ctx.moveTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y);
  ctx.quadraticCurveTo(b2.x + px(belly||0)*D.dir, b2.y - Math.abs(b2.y-t2.y)*0.28, b2.x, b2.y);
  ctx.quadraticCurveTo((b1.x+b2.x)/2, b2.y + px(6), b1.x, b1.y);
  ctx.closePath();
  // Cloth only takes a rim when the fighter is dark enough to vanish
  // without one — a dark outline round a pale robe is just a border.
  if(D.edge && D.dark){ ctx.strokeStyle = D.edge; ctx.lineWidth = px(2.0); ctx.lineJoin='round'; ctx.stroke(); }
  ctx.fill(); ctx.restore();
}
/* 6. ring — a shallow ellipse outline read in perspective. Haloes, glasses,
      emblems, bands. */
function ring(p, r, w, color, a){
  ctx.save(); ctx.globalAlpha = a===undefined ? 1 : a;
  ctx.beginPath(); ctx.ellipse(p.x, p.y, Math.abs(px(r)), Math.abs(px(r))*0.34, 0, 0, TAU);
  ctx.lineWidth = px(w); ctx.strokeStyle = color||D.col; ctx.stroke(); ctx.restore();
}
/* the default head, so a costume can add marks to it rather than replace it */
function baseHead(j, r){
  ctx.save(); fillAs(D.col, 1);
  ctx.beginPath(); ctx.arc(j.head.x, j.head.y, px(r===undefined ? D.hr : r), 0, TAU);
  ctx.fill(); ctx.restore();
}
/* a point offset from a joint, in rig units, respecting facing */
function off(p, ang, len){ return pt(p, ang, px(len), D.dir); }

/* ---- the 29 ---------------------------------------------------------
   One distinguishing read each. Original stylised geometry throughout —
   shapes chosen to survive at 30px, not reproductions of anyone's art. */
const COSTUMES = {
  /* ================= the sabre lineage ================= */
  vader: {
    head(j){
      const r = D.hr;
      // A DOME wants an ellipse. Built out of quads it reads as a box on
      // the shoulders, which is a different helmet entirely.
      mass(off(j.head,0,r*0.12), r*1.24, r*1.34, 0, D.col, 1);
      // the flared bottom flange, and the faceplate line across it
      plate([off(j.head,142,r*1.15), off(j.head,218,r*1.15),
             off(j.head,201,r*2.15), off(j.head,159,r*2.15)], D.col, 1);
      rod(off(j.head,152,r*1.3), off(j.head,208,r*1.3), 0.8, D.edge, 0.85, true);
      // the brow: two short angled marks that give the mask its scowl
      rod(off(j.head,52,r*1.0), off(j.head,86,r*0.72), 0.9, D.edge, 0.8, true);
      rod(off(j.head,308,r*1.0), off(j.head,274,r*0.72), 0.9, D.edge, 0.8, true);
    },
    torso(j){  // high square shoulders
      plate([off(j.shR,0,7), off(j.shL,0,7), off(j.shL,180,4), off(j.shR,180,4)], D.col, 0.95);
    }
  },
  luke: {   // deliberately the plain one: bare head, small hair, no cape
    head(j){ baseHead(j); spray(off(j.head,342,D.hr*0.7), 330, 5, 70, D.hr*0.7, D.hr*0.3, D.mark, 0.4); }
  },
  obiwan: {
    back(j){
      drape(j.shR, j.hip, off(j.knR,8,4), off(j.hip,166,26), D.col, 0.24, 5);
      drape(j.hip, j.shL, off(j.hip,194,28), off(j.knL,-8,4), D.col, 0.26, -5);
      mass(off(j.elL,120,10), D.hr*0.8, D.hr*0.5, 40, D.col, 0.30);   // sleeve flare
    },
    head(j){
      const r = D.hr;
      baseHead(j);
      spray(off(j.head,320,r*0.6), 320, 4, 60, r*0.62, r*0.28, D.mark, 0.3);
      plate([off(j.head,140,r*0.9), off(j.head,198,r*0.95), off(j.head,168,r*2.0)], D.mark, 1);
    }
  },
  anakin: {
    back(j){   // robe skirt, split at the front
      drape(j.shR, j.hip, off(j.knR,4,2), off(j.hip,170,26), D.col, 0.26, 4);
      drape(j.hip, j.shL, off(j.hip,190,26), off(j.knL,-4,2), D.col, 0.26, -4);
    },
    head(j){
      baseHead(j);
      mass(off(j.head,254,D.hr*0.66), D.hr*0.84, D.hr*0.66, 22, D.mark, 1);
      rod(off(j.head,214,D.hr*0.9), off(j.shL,196,D.hr*1.1), 1.1, D.mark, 0.9);  // padawan braid
    }
  },
