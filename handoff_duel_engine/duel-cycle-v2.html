/* Plasma: bloom, body, white core. An `unstable` blade (Kylo's, and Homer's
   at the client's request) gets a ragged edge and a length that flickers —
   drawn as a polyline with a deterministic wobble so it crackles rather than
   boiling, and a crossflow of stray sparks off the emitter. */
function drawBlade(from, to, glow, S, width, unstable, seed){
  ctx.save();
  ctx.lineCap = 'round';
  let path = null;
  if(unstable){
    const n = 7, dx = (to.x-from.x)/n, dy = (to.y-from.y)/n;
    const nx = -(to.y-from.y), ny = (to.x-from.x);
    const nl = Math.hypot(nx,ny) || 1;
    path = [];
    for(let i=0;i<=n;i++){
      const w = i===0 ? 0 : Math.sin(seed*3.1 + i*2.3)*1.9*S*(i/n);
      path.push({ x:from.x+dx*i + nx/nl*w, y:from.y+dy*i + ny/nl*w });
    }
  }
  function stroke(w){
    ctx.beginPath();
    if(path){ ctx.moveTo(path[0].x,path[0].y); for(let i=1;i<path.length;i++) ctx.lineTo(path[i].x,path[i].y); }
    else { ctx.moveTo(from.x,from.y); ctx.lineTo(to.x,to.y); }
    ctx.lineWidth = w; ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  ctx.shadowColor = glow; ctx.shadowBlur = 26*S;
  ctx.strokeStyle = glow; ctx.globalAlpha = 0.34; stroke((width+7)*S);
  ctx.shadowBlur = 12*S; ctx.globalAlpha = 0.85; stroke(width*S);
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  ctx.strokeStyle = '#ffffff'; stroke(Math.max(1, width*0.32)*S);
  ctx.restore();
}

/* The generic cape, for fighters whose costume does not draw its own. */
function drawCape(j, dir, color, sway, len){
  const drop = (len||74)*j.S;
  const b1 = { x:j.hip.x - dir*(16+sway)*j.S, y:j.hip.y + drop };
  const b2 = { x:j.hip.x - dir*(40+sway*1.5)*j.S, y:j.hip.y + drop*0.82 };
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(j.shR.x, j.shR.y);
  ctx.lineTo(j.shL.x, j.shL.y);
  ctx.quadraticCurveTo(b2.x, b2.y - drop*0.3, b2.x, b2.y);
  ctx.lineTo(b1.x, b1.y);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* An oriented hilt with both hands on it, rather than the 3.2px dot that
   used to stand in for a grip. `curved` cants the emitter off the grip axis,
   which is the whole of Dooku's read at this size. */
function drawHilt(hand, angle, dir, S, curved, second){
  const back = pt(hand, angle+180, 5.5*S, dir);
  const fore = pt(hand, angle + (curved ? -13 : 0), 7.5*S, dir);
  ctx.save();
  ctx.lineCap = 'butt';
  ctx.strokeStyle = '#3a3a41'; ctx.lineWidth = 4.4*S;
  ctx.beginPath(); ctx.moveTo(back.x,back.y); ctx.lineTo(fore.x,fore.y); ctx.stroke();
  ctx.strokeStyle = '#8d8d99'; ctx.lineWidth = 1.5*S;
  const c = pt(hand, angle+180, 1.5*S, dir);
  ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(fore.x,fore.y); ctx.stroke();
  ctx.fillStyle = '#16161a';
  ctx.beginPath(); ctx.arc(hand.x, hand.y, 2.4*S, 0, TAU); ctx.fill();
  if(second){ ctx.beginPath(); ctx.arc(second.x, second.y, 2.2*S, 0, TAU); ctx.fill(); }
  ctx.restore();
  return fore;   // the emitter: where the blade actually starts
}

/* Blade light on the body. The old pass was a fixed 1.6px offset at a flat
   alpha, which is a highlight rather than a light. This one takes the
   direction from the blade's midpoint to each limb and falls off with
   distance, so a blade held overhead lights the shoulders and a blade held
   low lights the shins. Cheap, and the largest single readability gain on a
   dark arena. */
function bladeLight(j, segs, glow, S, lw){
  if(!segs.length) return;
  let mx=0, my=0;
  for(const s of segs){ mx += (s.a.x+s.b.x)/2; my += (s.a.y+s.b.y)/2; }
  mx /= segs.length; my /= segs.length;
  const limbs = [[j.hip,j.neck],[j.shR,j.elR],[j.elR,j.haR],[j.shL,j.elL],[j.elL,j.haL],
                 [j.hip,j.knR],[j.knR,j.ftR],[j.hip,j.knL],[j.knL,j.ftL]];
  const reach = 130*S;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.strokeStyle = glow;
  for(const [a,b] of limbs){
    const cxx=(a.x+b.x)/2, cyy=(a.y+b.y)/2;
    let dx = cxx-mx, dy = cyy-my;
    const d = Math.hypot(dx,dy) || 1;
    const fall = clamp(1 - d/reach, 0, 1);
    if(fall < 0.04) continue;
    const o = lw*0.30;
    dx/=d; dy/=d;
    ctx.globalAlpha = 0.06 + 0.30*fall*fall;
    ctx.lineWidth = lw*0.36;
    ctx.beginPath();
    ctx.moveTo(a.x+dx*o, a.y+dy*o); ctx.lineTo(b.x+dx*o, b.y+dy*o);
    ctx.stroke();
  }
  ctx.restore();
}

/* WHERE THE BLADE IS, derived once from the numbers that draw it.
   Extracted because two things need it and they must never disagree:
   `drawFigure` draws it, and `impactPoint` places sparks on it. Reading the
   PREVIOUS frame's drawn geometry instead put bursts a measured 14px off the
   sword during a fast cut, because that is how far a tip travels in 16ms. */
function weaponGeom(j, pose, char, dir){
  const ext = clamp(pose.weaponExtend, 0, 1);
  const spin = (pose.rot||0)*dir;
  const wAngle = pose.weaponAngle + spin*dir;   // keep the blade with the body
  const wAngleL = pose.weaponAngleL + spin*dir;
  const out = { segs:[], tip:j.haR, tipL:null, wAngle, wAngleL,
                emit:j.haR, ang:wAngle, baseLen:0, blunt:char.weapon === 'blunt' };
  if(out.blunt){
    out.tip = pt(j.haR, wAngle, 46*j.S*Math.max(ext, 0.35), dir);
    return out;
  }
  if(ext <= 0.02) return out;
  const baseLen = char.bladeLen * j.S * ext;
  const wob = char.unstable ? 1 + Math.sin(clock()*11 + j.hip.x*0.03)*0.035 : 1;
  const ang = wAngle + (char.curvedHilt ? -13 : 0);
  // the emitter, not the hand: a hilt is a real object and the blade starts
  // at the far end of it
  const emit = char.weapon === 'staff' ? j.haR : pt(j.haR, ang, 7.5*j.S, dir);
  out.emit = emit; out.ang = ang; out.baseLen = baseLen;
  out.tip = pt(emit, ang, baseLen*wob, dir);
  out.segs.push({ a:emit, b:out.tip });
  if(char.weapon === 'staff'){
    out.tipL = pt(j.haR, wAngle+180, baseLen, dir);
    out.segs.push({ a:j.haR, b:out.tipL });
  } else if(char.weapon === 'dual'){
    out.tipL = pt(j.haL, wAngleL, baseLen*0.86, dir);
    out.segs.push({ a:j.haL, b:out.tipL });
  }
  return out;
}

function drawFigure(x, yOff, dir, pose, char, airborne, fx){
  const j = computeJoints(x, yOff, dir, pose, char);
  const R = j.R;
  const lw = 6.2*j.S;
  const edge = edgeColor(char.color);
  fx = fx || {};

  ctx.save();

  // ground shadow — tightens and fades when airborne
  const air = clamp((airborne||0)/170, 0, 1);
  ctx.beginPath();
  ctx.ellipse(x, groundY+4, (34 - 16*air)*j.S, (8 - 3.5*air)*j.S, 0, 0, TAU);
  ctx.fillStyle = "rgba(0,0,0," + (0.35 - 0.2*air).toFixed(3) + ")";
  ctx.fill();

  /* The costume draw context. Everything a costume needs, in rig units. */
  const dark = luminance(char.color) < 0.32;
  D = { col:char.color, glow:char.glow, edge, hr:R.headR, lw:6.2,
        mark: markColor(char),
        S:j.S, dir, char, fx, dark, rimW: dark ? 2.6 : 1.1 };
  const co = char.draw || {};

  // BACK — cloth and extra limbs, behind everything, translucent
  if(co.back) co.back(j, dir, j.S);
  else if(char.cape) drawCape(j, dir, char.color, clamp((pose.lean||0)*0.4, -8, 12));

  // edge pass — keeps the silhouette readable whatever the arena
  paintSkeleton(j, lw*1.5, edge);
  ctx.beginPath();
  ctx.arc(j.head.x, j.head.y, (R.headR+1.7)*j.S, 0, TAU);
  ctx.fillStyle = edge; ctx.fill();

  // back limbs, slightly recessed for depth
  ctx.save();
  ctx.globalAlpha = 0.74;
  strokeLine(j.shL, j.elL, lw, char.color);
  strokeLine(j.elL, j.haL, lw, char.color);
  strokeLine(j.hip, j.knL, lw, char.color);
  strokeLine(j.knL, j.ftL, lw, char.color);
  ctx.restore();
  // torso — a stroke, never a filled slab
  strokeLine(j.hip, j.neck, lw*1.05, char.color);
  if(co.torso) co.torso(j, dir, j.S);
  // front leg
  strokeLine(j.hip, j.knR, lw, char.color);
  strokeLine(j.knR, j.ftR, lw, char.color);
  // head — the costume's if it has one
  if(co.head) co.head(j, dir, j.S);
  else {
    ctx.beginPath();
    ctx.arc(j.head.x, j.head.y, R.headR*j.S, 0, TAU);
    ctx.fillStyle = char.color; ctx.fill();
  }
  // front arm
  strokeLine(j.shR, j.elR, lw, char.color);
  strokeLine(j.elR, j.haR, lw, char.color);
  if(co.overlay) co.overlay(j, dir, j.S);

  /* --- the weapon ------------------------------------------------------ */
  const wp = weaponGeom(j, pose, char, dir);
  const segs = wp.segs;
  let tipR = wp.tip, tipL = wp.tipL;

  if(wp.blunt){
    ctx.save();
    ctx.lineCap = 'round';
    ctx.shadowColor = "#000"; ctx.shadowBlur = 4*j.S;
    ctx.strokeStyle = char.glow; ctx.lineWidth = 9.5*j.S;
    ctx.beginPath(); ctx.moveTo(j.haR.x,j.haR.y); ctx.lineTo(tipR.x,tipR.y); ctx.stroke();
    if(char.bluntHead === 'mace'){
      ctx.fillStyle = char.glow;
      ctx.beginPath(); ctx.arc(tipR.x, tipR.y, 9*j.S, 0, TAU); ctx.fill();
      for(let i=0;i<6;i++){
        const p2 = pt(tipR, i*60, 15*j.S, dir);
        ctx.strokeStyle = char.glow; ctx.lineWidth = 3*j.S;
        ctx.beginPath(); ctx.moveTo(tipR.x,tipR.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
      }
    } else if(char.bluntHead === 'board'){
      const a = pt(tipR, wp.wAngle+90, 20*j.S, dir), b = pt(tipR, wp.wAngle-90, 20*j.S, dir);
      ctx.strokeStyle = char.glow; ctx.lineWidth = 6*j.S; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      ctx.fillStyle = '#c8c8d0';
      for(const w of [a,b]){
        const p2 = pt(w, wp.wAngle, 6*j.S, dir);
        ctx.beginPath(); ctx.arc(p2.x,p2.y,2.6*j.S,0,TAU); ctx.fill();
      }
    }
    ctx.restore();
  } else if(segs.length){
    drawHilt(j.haR, wp.wAngle, dir, j.S, char.curvedHilt,
             pose.grip > 0.5 && char.weapon !== 'dual' ? j.haL : null);
    drawBlade(segs[0].a, segs[0].b, char.glow, j.S, 6.4, char.unstable, x*0.01);
    if(char.weapon === 'staff'){
      drawBlade(segs[1].a, segs[1].b, char.glow, j.S, 6.4);
    } else if(char.weapon === 'dual'){
      drawBlade(segs[1].a, segs[1].b, char.glow, j.S, 5.4);
      drawHilt(j.haL, wp.wAngleL, dir, j.S, false, null);
    } else if(char.crossguard){
      // the two quillons — a quarter of the length, square to the blade
      const q1 = pt(wp.emit, wp.ang+82, wp.baseLen*0.24, dir);
      const q2 = pt(wp.emit, wp.ang-82, wp.baseLen*0.24, dir);
      drawBlade(wp.emit, q1, char.glow, j.S, 4.0, true, x*0.01+2);
      drawBlade(wp.emit, q2, char.glow, j.S, 4.0, true, x*0.01+5);
    }
  }

  // the blade lighting the body — after the weapon, so it knows where it is
  if(segs.length) bladeLight(j, segs, char.glow, j.S, lw);

  /* One or two frames of white silhouette on the struck fighter. The single
     cheapest way to make a hit land — the eye reads the flash as impact
     before it reads the pose. */
  if(fx.hit > 0.01){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(fx.hit, 0, 1)*0.85;
    paintSkeleton(j, lw*1.25, '#ffffff');
    ctx.beginPath(); ctx.arc(j.head.x, j.head.y, R.headR*j.S, 0, TAU);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.restore();
  }

  ctx.restore();
  D = null;
  return { hand:j.haR, handL:j.haL, tip:tipR, tipL, head:j.head, hip:j.hip,
           neck:j.neck, S:j.S, segs };
}

/* ---- blade trails ---- */
const TRAIL_MIN = 7;    // px the tip must travel to earn a sample
function pushTrail(trail, hand, tip){
  const last = trail[trail.length-1];
  if(last && Math.hypot(tip.x-last.tx, tip.y-last.ty) < TRAIL_MIN){
    // standing still: let the smear drain instead of thickening into a fan
    if(trail.length) trail.shift();
    return;
  }
  trail.push({ hx:hand.x, hy:hand.y, tx:tip.x, ty:tip.y });
  if(trail.length > 7) trail.shift();
}
function drawTrail(trail, color){
  if(trail.length < 2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = color;
  for(let i=1;i<trail.length;i++){
    const a = trail[i-1], b = trail[i];
    // Quadratic, so the smear collapses to almost nothing behind a slow
    // blade and only opens up on a real swing.
    const f = i/trail.length;
    ctx.globalAlpha = f*f * 0.11;
    ctx.beginPath();
    ctx.moveTo(a.hx, a.hy); ctx.lineTo(a.tx, a.ty);
    ctx.lineTo(b.tx, b.ty); ctx.lineTo(b.hx, b.hy);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ============================== BACKGROUND ============================== */
function drawBackground(arena, t){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, arena.bg[0]);
  g.addColorStop(1, arena.bg[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  drawScenery(arena, t);
  ctx.beginPath();
  ctx.moveTo(0, groundY+2); ctx.lineTo(W, groundY+2);
  ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawScenery(arena, t){
  const s = arena.scenery;
  if(s === 'none') return;
  ctx.save();
  const horizon = groundY;

  if(s === 'pillars'){
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    const n = 7;
    for(let i=0;i<n;i++){
      const x = (i+0.5)*(W/n);
      const w = W/n*0.16;
      const h = horizon - H*rand(0.001,0.0011) - H*0.30;
      ctx.fillRect(x-w/2, h, w, horizon-h);
      ctx.fillRect(x-w*0.9, h-10, w*1.8, 12);
    }
  } else if(s === 'city'){
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    let x = -30;
    let seed = 1;
    while(x < W+40){
      seed = (seed*9301+49297)%233280;
      const r = seed/233280;
      const w = 34 + r*70;
      const h = H*0.14 + r*H*0.26;
      ctx.fillRect(x, horizon-h, w, h);
      x += w + 8;
    }
  } else if(s === 'mountains'){
    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    ctx.beginPath(); ctx.moveTo(-40, horizon);
    const peaks = 6;
    for(let i=0;i<=peaks;i++){
      const px = -40 + i*((W+80)/peaks);
      const py = horizon - (i%2===0 ? H*0.28 : H*0.16);
      ctx.lineTo(px, py);
    }
    ctx.lineTo(W+40, horizon); ctx.closePath(); ctx.fill();
  } else if(s === 'dunes'){
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.moveTo(0, horizon);
    for(let x=0;x<=W;x+=20){
      ctx.lineTo(x, horizon - 26 - Math.sin(x*0.004)*22 - Math.sin(x*0.011)*10);
    }
    ctx.lineTo(W, horizon); ctx.closePath(); ctx.fill();
  } else if(s === 'trees'){
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    for(let i=0;i<10;i++){
      const x = (i+0.5)*(W/10) + Math.sin(i*3.1)*20;
      const w = 8 + (i%3)*5;
      const h = H*0.22 + (i%4)*H*0.05;
      ctx.fillRect(x, horizon-h, w, h);
    }
  } else if(s === 'houses'){
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    for(let i=0;i<5;i++){
      const w = W/5*0.62, x = i*(W/5) + W/5*0.19;
      const h = H*0.13;
      ctx.fillRect(x, horizon-h, w, h);
      ctx.beginPath();
      ctx.moveTo(x-8, horizon-h); ctx.lineTo(x+w/2, horizon-h-28); ctx.lineTo(x+w+8, horizon-h);
      ctx.closePath(); ctx.fill();
    }
  } else if(s === 'spikes'){
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    for(let i=0;i<9;i++){
      const x = (i+0.5)*(W/9);
      const h = H*(0.12 + (i%3)*0.06);
      ctx.beginPath();
      ctx.moveTo(x-18, horizon); ctx.lineTo(x, horizon-h); ctx.lineTo(x+18, horizon);
      ctx.closePath(); ctx.fill();
    }
  } else if(s === 'lava'){
    const pulse = 0.5 + 0.5*Math.sin(t*0.0016);
    const lg = ctx.createLinearGradient(0, horizon-90, 0, horizon+4);
    lg.addColorStop(0, 'rgba(255,90,20,0)');
    lg.addColorStop(1, 'rgba(255,120,30,' + (0.20+0.12*pulse).toFixed(3) + ')');
    ctx.fillStyle = lg;
    ctx.fillRect(0, horizon-90, W, 94);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    for(let i=0;i<6;i++){
      const x = (i+0.5)*(W/6);
      const h = H*(0.09 + (i%2)*0.05);
      ctx.beginPath();
      ctx.moveTo(x-40, horizon-40); ctx.lineTo(x, horizon-40-h); ctx.lineTo(x+40, horizon-40);
      ctx.closePath(); ctx.fill();
    }
  } else if(s === 'rings'){
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 2;
    for(let i=1;i<=3;i++){
      ctx.beginPath();
      ctx.ellipse(W*0.72, horizon-H*0.18, W*0.20*i*0.55, H*0.05*i*0.6, -0.34, 0, TAU);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.028)';
    ctx.beginPath(); ctx.arc(W*0.72, horizon-H*0.18, W*0.09, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ============================== CHOREOGRAPHY GENERATOR ==============================
   A duel is generated as a beat list. Each beat is a pose-to-pose
   transition with optional travel, impact, camera and timing data.

   beat = {
     poseA, poseB, dur,
     dxA, dxB          travel in world units
     arcA, arcB        jump height
     spinA, spinB      full-rotation degrees applied over the beat
     ease              'inout' | 'out' | 'in' | 'back'
     contact           0..1 position between A and B for the impact
     spark             spark count
     shake:[mag,dur], flash:{color,a}, hitstop, slow,
     sfx               'clash' | 'boom' | 'thud' | 'zap' | 'ignite'
     cam:{z, focus}, swap, noSep, resolve
   }
*/
const ARENA_HALF = 470;
const MIN_SEP = 138;
const MAX_SEP = 720;

function makeBuilder(tempo){
  const beats = [];
  const S = { xA:-300, xB:300, side:1 };
  function push(b){
    const dxA = b.dxA||0, dxB = b.dxB||0;
    let nA = S.xA + dxA, nB = S.xB + dxB;
    if(b.swap) S.side *= -1;
    nA = clamp(nA, -ARENA_HALF, ARENA_HALF);
    nB = clamp(nB, -ARENA_HALF, ARENA_HALF);
    if(!b.noSep){
      // Iterate: when one fighter is pinned against the arena edge, the
      // separation fix has to be absorbed entirely by the other one.
      for(let i=0;i<4;i++){
        const sep = (nB - nA) * S.side;
        const want = clamp(sep, MIN_SEP, MAX_SEP);
        if(want === sep) break;
        const fix = (want - sep)/2 * S.side;
        nA -= fix; nB += fix;
        nA = clamp(nA, -ARENA_HALF, ARENA_HALF);
        nB = clamp(nB, -ARENA_HALF, ARENA_HALF);
      }
    }
    b.dxA = nA - S.xA; b.dxB = nB - S.xB;
    S.xA = nA; S.xB = nB;
    b.dur = Math.max(0.08, b.dur / tempo);
    beats.push(b);
    return b;
  }
  function fwd(who){ return (who==='A' ? 1 : -1) * S.side; }
  function sep(){ return Math.abs(S.xB - S.xA); }
  function posOf(who){ return who==='A' ? S.xA : S.xB; }
  // Where would `who` land if they vaulted past their opponent?
  function landingFor(who){
    const other = who==='A' ? 'B' : 'A';
    return posOf(other) + 168 * fwd(who);
  }
  // Is there actually arena left on the far side to land in?
  function hasVaultRoom(who){
    return Math.abs(landingFor(who)) <= ARENA_HALF - 12;
  }
  return { beats, S, push, fwd, sep, posOf, landingFor, hasVaultRoom };
}

/* --- beat helper: assigns poses by role --- */
/* Keys that mean "the attacker" or "the defender" and therefore have to be
   translated into A/B below rather than copied through. */
const ROLE_KEYS = { stepAtk:1, stepDef:1, arcAtk:1, arcDef:1,
                    spinAtk:1, spinDef:1, turnAtk:1, turnDef:1, dur:1 };

function rolePush(g, atk, def, atkPose, defPose, o){
  o = o || {};
  const b = { dur: o.dur !== undefined ? o.dur : 0.3 };
  /* Everything else the caller passes rides along untouched. This used to be
     a whitelist of thirteen field names, which meant every beat property
     added after it was written — `bolts`, `prop`, `propColor`, `gag`,
     `cocoa` — was silently dropped on the floor. The modules that depended
     on them ran, emitted beats, and did nothing, while still looking
     completely correct in the source. A whitelist is the wrong shape here:
     the role translation is the special case, not the payload. */
  for(const k in o) if(!ROLE_KEYS[k]) b[k] = o[k];
  b['pose'+atk] = atkPose;
  b['pose'+def] = defPose;
  if(o.stepAtk) b['dx'+atk] = o.stepAtk * g.fwd(atk);
  if(o.stepDef) b['dx'+def] = o.stepDef * g.fwd(def);
  if(o.arcAtk) b['arc'+atk] = o.arcAtk;
  if(o.arcDef) b['arc'+def] = o.arcDef;
  if(o.spinAtk) b['spin'+atk] = o.spinAtk;
  if(o.spinDef) b['spin'+def] = o.spinDef;
  if(o.turnAtk) b['turn'+atk] = true;
  if(o.turnDef) b['turn'+def] = true;
  return g.push(b);
}

/* Contact point biased toward the defender. */
function contactAt(g, def){ return def==='A' ? 0.34 : 0.66; }

/* A grounded spin turns the fighter about their own vertical axis. Because
   the rig mirrors on `dir`, sweeping dir through cos() foreshortens the body
   exactly the way a turn should — edge-on at the quarter points. `rot` is
   reserved for genuine aerial somersaults. */
function turnFactor(t){
  const c = Math.cos(TAU*t);
  return (c >= 0 ? 1 : -1) * Math.max(0.14, Math.abs(c));
}

/* --- choreography modules ---
   The generator picks WHICH module runs and in what order, and that stays
   random. What a module does once picked is authored — that is the whole
   division of labour here, and it is why "make the fights read better" and
   "keep the fights procedurally generated" are not in conflict.

   Three things below are the difference between a duel and two people
   waving sticks, and all three were missing:

   1. CUTS CHAIN. A blade ends somewhere, and the next one starts from
      there. `choice(STRIKES)` picks uniformly and has no memory, so every
      exchange was a sequence of unrelated swings that each reset to
      neutral first.
   2. THEY HOLD DISTANCE. Every strike used to carry a 20–26 unit step, so
      the pair marched the arena and the separation clamp shoved them back.
      Ground is now taken deliberately, by modules whose job is taking it
      (`mPress`, `mFlurry`), and an exchange happens at one distance with
      footwork.
   3. THERE IS A BEAT WHERE NOTHING HAPPENS. Wind-ups hold at the top,
      recoveries settle, and `mStandoff` is nothing but two people looking
      at each other. A fight reads through the contrast.
*/
const STRIKES = ['strikeDown','strikeAcross','strikeUp','thrust'];
const WINDUPS = { strikeDown:'windupHigh', strikeAcross:'windupSide', strikeUp:'windupLow', thrust:'guard' };
const BLOCKS  = { strikeDown:'blockHigh', strikeAcross:'blockMid', strikeUp:'blockLow', thrust:'parry' };

/* Where a blade can go from where it just finished. A downward cut ends
   low, so it rises or goes lateral next; a rising cut ends high. Repeating
   `strikeAcross` is deliberate — that is the backhand return. */
const STRIKE_CHAIN = {
  strikeDown:   ['strikeUp','strikeAcross','thrust','strikeAcross'],
  strikeAcross: ['strikeAcross','strikeDown','thrust'],
  strikeUp:     ['strikeDown','strikeAcross','strikeAcross'],
  thrust:       ['strikeAcross','strikeDown','strikeUp']
};
function nextStrike(prev){
  if(!prev) return choice(STRIKES);
  return choice(STRIKE_CHAIN[prev] || STRIKES);
}

/* A held beat: the same pose twice, so `lerpPose` has nothing to move.
   This is the "dead hold" at the top of a wind-up and the settle after an
   exchange, and it costs one line. */
function hold(g, atk, def, atkPose, defPose, dur){
  return rolePush(g, atk, def, atkPose, defPose, { dur, ease:'out' });
}

/* Close to a given separation. A blade lock is nose to nose, and a fixed
   `stepAtk: 30` cannot deliver that — where it ends up depends entirely on
   how far apart the previous module happened to leave them, which is how a
   sabre lock ended up being played at arm's length and the cocoa ending got
   framed with one fighter off the side of the panel. */
function closeTo(g, atk, def, target, o){
  const need = (g.sep() - target)/2;
  return Object.assign({}, o || {}, { stepAtk:need, stepDef:need });
}

/* Circling: both fighters travel the same way across the screen. `fwd` is
   opposite for the two roles, so opposed signs slide the pair sideways
   instead of closing them. */
function circle(g, atk, def, d, dur){
  return rolePush(g, atk, def, 'circleStep', 'circleStep',
                  { dur:dur||0.42, stepAtk:d, stepDef:-d });
}

/* A CUT CAN ONLY LAND FROM INSIDE REACH, and this was the largest remaining
   realism problem. A blade tip sits about 118 world units forward of the
   hip, so two facing fighters cross blades at roughly 236 and reach a body
   at roughly 118. Measured over 1,262 beats that claimed a blade connected,
   the median separation was 219 and **43% were scheduled further apart than
   the two blades could physically meet** — the swing went through empty air
   and the sparks had nowhere to be but the end of a sword pointing at
   nobody. Fixed steps cannot solve it: where a strike lands depends entirely
   on how far apart the previous module happened to leave the pair. */
const STRIKE_RANGE = MIN_SEP + 22;
function closeStep(g, min){
  return clamp(g.sep() - STRIKE_RANGE, min === undefined ? 6 : min, 78);
}

/* One authored exchange: wind up, hold, cut, recover — with the wind-up
   skipped when the blade is already where the next cut starts from, which
   is what makes a flurry flow instead of stutter. The approach happens on
   the WIND-UP, because that is when a fighter steps in. */
function swing(g, atk, def, s, o){
  o = o || {};
  if(!o.noWindup){
    rolePush(g, atk, def, WINDUPS[s], 'guard',
             { dur:o.windup || 0.2, stepAtk: closeStep(g, 0)*0.55 });
    if(o.heavy) hold(g, atk, def, WINDUPS[s], 'guard', o.heavy);
  }
  return rolePush(g, atk, def, s, BLOCKS[s], {
    dur: o.dur || 0.17,
    stepAtk: o.stepAtk === undefined ? closeStep(g) : o.stepAtk,
    stepDef: o.stepDef === undefined ? -7 : o.stepDef,
    contact: contactAt(g, def),
    spark: o.spark || 13,
    shake: o.shake || [2.8, 0.15],
    sfx: 'clash',
    hitstop: o.hitstop === undefined ? 0.03 : o.hitstop,
    flash: o.flash, slow: o.slow, cam: o.cam
  });
}

/* Move back to guard, and then STAY there. The second beat is the one that
   matters — it is the frame in which nothing happens, and a fight reads
   through the contrast between that and the exchange either side of it. A
   single beat returning to guard is a recovery; this is a rest. */
function settle(g, atk, def){
  rolePush(g, atk, def, 'guard', 'guard', { dur:0.3, ease:'out' });
  hold(g, atk, def, 'guard', 'guard', rand(0.22, 0.48));
}

/* The defender takes a moment to be hurt. `wounded` was in the pose table
   from the start and nothing ever reached it. */
function reel(g, atk, def){
  rolePush(g, atk, def, 'guard', 'wounded', { dur:0.36, stepDef:-12, ease:'out' });
}

function mProbe(g, atk, def){
  circle(g, atk, def, 20, 0.44);
  const s = nextStrike();
  swing(g, atk, def, s, { windup:0.24, heavy:0.1, spark:11 });
  settle(g, atk, def);
}

function mExchange(g, atk, def, count){
  count = count || randInt(2,4);
  let a = atk, d = def, prev = null;
  for(let i=0;i<count;i++){
    const s = nextStrike(prev);
    swing(g, a, d, s, {
      windup: i===0 ? 0.2 : 0.14,
      heavy: i===0 && chance(0.5) ? 0.1 : 0,
      spark: 14
    });
    prev = s;
    const t = a; a = d; d = t;   // riposte — roles swap
  }
  settle(g, a, d);
}

function mFlurry(g, atk, def){
  rolePush(g, atk, def, 'windupHigh', 'guard', { dur:0.22, cam:{z:1.12, focus:0.5} });
  hold(g, atk, def, 'windupHigh', 'guard', 0.12);
  const n = randInt(4,6);
  let prev = 'strikeDown';
  for(let i=0;i<n;i++){
    // A flurry is the one place ground is taken, and it is taken up front.
    const s = nextStrike(prev); prev = s;
    swing(g, atk, def, s, {
      noWindup:true, dur:0.125, spark:9, shake:[2.4,0.1], hitstop:0,
      stepAtk: i<2 ? 15 : 4, stepDef: i<2 ? -11 : -3
    });
  }
  rolePush(g, atk, def, 'strikeAcross', 'stagger', {
    dur:0.24, stepAtk:12, stepDef:-30, contact:contactAt(g,def), spark:22,
    shake:[5,0.24], sfx:'clash', hitstop:0.06, flash:{color:'#ffffff', a:0.14}
  });
  if(chance(0.5)) reel(g, atk, def);
  settle(g, atk, def);
}

/* Driving the other one backwards across the arena, blade grinding on
   blade. The most quoted image in the genre, and the answer to "they drift"
   — this is ground taken on purpose rather than accumulated by accident. */
function mPress(g, atk, def){
  rolePush(g, atk, def, 'windupHigh', 'guardHigh', { dur:0.24, cam:{z:1.1, focus:0.5} });
  const n = randInt(3,5);
  for(let i=0;i<n;i++){
    rolePush(g, atk, def, 'pressFwd', 'pressBack', {
      dur:0.27, stepAtk:30, stepDef:-27, contact:contactAt(g,def), spark:9,
      shake:[2.4,0.12], sfx:'clash', cam:{z:1.1, focus:0.5}
    });
  }
  rolePush(g, atk, def, 'strikeDown', 'stagger', {
    dur:0.24, stepAtk:14, stepDef:-34, contact:contactAt(g,def), spark:24,
    shake:[6,0.28], sfx:'clash', hitstop:0.06, flash:{color:'#ffffff', a:0.16}
  });
  if(chance(0.65)) reel(g, atk, def);
  settle(g, atk, def);
}

function mBindRiposte(g, atk, def){
  rolePush(g, atk, def, 'windupSide', 'guardBack', { dur:0.26 });
  hold(g, atk, def, 'windupSide', 'guardBack', 0.11);
  rolePush(g, atk, def, 'thrust', 'parry', {
    dur:0.18, stepAtk:closeStep(g), contact:contactAt(g,def), spark:10,
    shake:[2,0.12], sfx:'clash'
  });
  // the riposte leaves from the parry's own blade angle, so it needs no
  // wind-up of its own — that is what makes a counter feel instant
  rolePush(g, def, atk, 'riposte', 'stagger', {
    dur:0.18, stepAtk:14, stepDef:-22, contact:contactAt(g,atk), spark:18,
    shake:[4,0.2], sfx:'clash', hitstop:0.05
  });
  settle(g, atk, def);
}

function mSaberLock(g, atk, def){
  rolePush(g, atk, def, 'windupHigh', 'windupHigh', { dur:0.28, cam:{z:1.0} });
  rolePush(g, atk, def, 'lockPush', 'lockPush', closeTo(g, atk, def, MIN_SEP + 6, {
    dur:0.34, contact:0.5, spark:26,
    shake:[4,0.28], sfx:'clash', hitstop:0.07, flash:{color:'#ffffff', a:0.18},
    cam:{z:1.24, focus:0.5}
  }));
  const winner = chance(0.5) ? atk : def;
  const loser = winner===atk ? def : atk;
  rolePush(g, winner, loser, 'lockStrainF', 'lockStrainB', {
    dur:0.5, slow:0.9, stepAtk:14, stepDef:-14, contact:0.5, spark:16, cam:{z:1.3, focus:0.5}
  });
  rolePush(g, winner, loser, 'lockPush', 'knockback', {
    dur:0.32, stepAtk:10, stepDef:-58, contact:0.35, spark:24,
    shake:[7,0.3], sfx:'boom', flash:{color:'#ffffff', a:0.2}, hitstop:0.05
  });
  settle(g, winner, loser);
}

function mSweepLeap(g, atk, def){
  rolePush(g, atk, def, 'windupLow', 'guard', { dur:0.24 });
  rolePush(g, atk, def, 'sweepLow', 'leap', {
    dur:0.26, stepAtk:16, arcDef:120, contact:contactAt(g,def), spark:8, sfx:'clash',
    cam:{z:1.14, focus:0.5}
  });
  rolePush(g, atk, def, 'guard', 'land', { dur:0.24, stepDef:-14, sfx:'land', shake:[3,0.16] });
  rolePush(g, def, atk, 'riposte', 'blockLow', {
    dur:0.19, stepAtk:12, contact:contactAt(g,atk), spark:14, shake:[3,0.16], sfx:'clash'
  });
  settle(g, atk, def);
}

/* A somersault clean over a low sweep. `tuck` drops the hips in the pose
   so the spin reads as a body turning rather than legs through the floor. */
function mSomersault(g, atk, def){
  rolePush(g, atk, def, 'windupLow', 'guard', { dur:0.22 });
  const b = { dur:0.46, ease:'out', noSep:true, cam:{z:1.16, focus:0.5} };
  b['pose'+atk] = 'sweepLow';
  b['pose'+def] = 'tuck';
  b['arc'+def]  = 140;
  b['spin'+def] = 360;
  b['dx'+atk]   = 16*g.fwd(atk);
  g.push(b);
  rolePush(g, atk, def, 'guard', 'land', { dur:0.24, sfx:'land', shake:[3,0.16] });
  rolePush(g, def, atk, 'strikeDown', 'blockHigh', {
    dur:0.19, stepAtk:10, contact:contactAt(g,atk), spark:16, shake:[3.5,0.18], sfx:'clash'
  });
  settle(g, atk, def);
}

function mDuckCounter(g, atk, def){
  rolePush(g, atk, def, 'windupSide', 'guard', { dur:0.22 });
  rolePush(g, atk, def, 'strikeAcross', 'duck', { dur:0.2, stepAtk:16, cam:{z:1.16, focus:0.5} });
  rolePush(g, def, atk, 'strikeUp', 'blockLow', {
    dur:0.19, stepAtk:closeStep(g), contact:contactAt(g,atk), spark:16,
    shake:[3.5,0.18], sfx:'clash', hitstop:0.04
  });
  settle(g, atk, def);
}

function mLeapOver(g, atk, def){
  // Land clear on the far side — computed from live positions, not a fixed
  // offset, so a fighter backed against the arena edge can't be landed on.
  const travel = g.landingFor(atk) - g.posOf(atk);
  rolePush(g, atk, def, 'leap', 'guardHigh', { dur:0.26, arcAtk:60, cam:{z:1.1, focus:0.5} });
  const b = { dur:0.5, ease:'out', swap:true, noSep:true, cam:{z:1.08, focus:0.5} };
  b['pose'+atk] = 'flipAir';
  b['pose'+def] = 'blockHigh';
  b['dx'+atk] = travel;
  b['arc'+atk] = 180;
  b['spin'+atk] = 360;
  g.push(b);
  rolePush(g, atk, def, 'land', 'guard', { dur:0.26, sfx:'land', shake:[3,0.16] });
  rolePush(g, atk, def, 'strikeDown', 'blockHigh', {
    dur:0.2, stepAtk:10, contact:contactAt(g,def), spark:16, shake:[3.5,0.18], sfx:'clash'
  });
  settle(g, atk, def);
}

/* Straight up, and down again with the whole weight of it behind an
   overhead. Gated on room the same way the vault is. */
function mAirStrike(g, atk, def){
  rolePush(g, atk, def, 'leap', 'guardHigh', { dur:0.26, arcAtk:100, cam:{z:1.12, focus:0.5} });
  const b = { dur:0.34, ease:'in', noSep:true, cam:{z:1.2, focus:0.5} };
  b['pose'+atk] = 'airStrike';
  b['pose'+def] = 'blockHigh';
  b['arc'+atk]  = 150;
  b['dx'+atk]   = 44*g.fwd(atk);
  b.contact = contactAt(g, def); b.spark = 26; b.shake = [7,0.3];
  b.sfx = 'clash'; b.hitstop = 0.07; b.flash = { color:'#ffffff', a:0.18 };
  g.push(b);
  rolePush(g, atk, def, 'land', 'stagger', {
    dur:0.28, stepDef:-26, sfx:'land', shake:[4,0.2]
  });
  settle(g, atk, def);
}

/* A back handspring out from under pressure. `spin` is negative because the
   rotation has to agree with the direction of travel. */
function mHandspring(g, atk, def){
  rolePush(g, atk, def, 'windupSide', 'guardBack', { dur:0.2 });
  const b = { dur:0.44, ease:'out', noSep:true, cam:{z:1.12, focus:0.5} };
  b['pose'+atk] = 'strikeAcross';
  b['pose'+def] = 'handspring';
  b['arc'+def]  = 96;
  b['spin'+def] = -360;
  b['dx'+def]   = -104 * g.fwd(def);
  b['dx'+atk]   = 22 * g.fwd(atk);
  g.push(b);
  rolePush(g, atk, def, 'guard', 'land', { dur:0.26, sfx:'land', shake:[2.6,0.14] });
  circle(g, atk, def, 14, 0.36);
}

/* Backed against the edge and reversing off it. Only fires when a fighter
   really is against the wall, and only when there is room on the far side
   to land — the same two guards the vault uses. */
function mWallKick(g, atk, def){
  rolePush(g, def, atk, 'strikeAcross', 'guardBack', { dur:0.24, stepAtk:18 });
  const b = { dur:0.46, ease:'out', noSep:true, swap:true, cam:{z:1.2, focus:0.5} };
  b['pose'+atk] = 'wallKick';
  b['pose'+def] = 'blockHigh';
  b['arc'+atk]  = 158;
  b['spin'+atk] = 360;
  b['dx'+atk]   = g.landingFor(atk) - g.posOf(atk);
  g.push(b);
  rolePush(g, atk, def, 'land', 'guard', { dur:0.26, sfx:'land', shake:[3.4,0.18] });
  rolePush(g, atk, def, 'strikeDown', 'blockHigh', {
    dur:0.2, stepAtk:10, contact:contactAt(g,def), spark:18, shake:[4,0.2], sfx:'clash', hitstop:0.04
  });
  settle(g, atk, def);
}

/* Under the cut and up on the far side. `rollTuck` drops the hips rather
   than trying to lay the rig flat — the same compromise `deathFall` makes,
   and the reason a roll is expressible on a hip-pivot rig at all. */
function mRoll(g, atk, def){
  const travel = g.landingFor(def) - g.posOf(def);
  rolePush(g, atk, def, 'windupSide', 'guard', { dur:0.22 });
  const b = { dur:0.44, ease:'out', noSep:true, swap:true, cam:{z:1.14, focus:0.5} };
  b['pose'+atk] = 'strikeAcross';
  b['pose'+def] = 'rollTuck';
  b['dx'+def]   = travel;
  b['spin'+def] = 360;
  g.push(b);
  rolePush(g, atk, def, 'guard', 'rollUp', { dur:0.26, sfx:'land', shake:[2.2,0.12] });
  rolePush(g, def, atk, 'riposte', 'blockLow', {
    dur:0.19, stepAtk:12, contact:contactAt(g,atk), spark:16, shake:[3.5,0.18], sfx:'clash'
  });
  settle(g, atk, def);
}

function mSpinAttack(g, atk, def){
  rolePush(g, atk, def, 'windupSide', 'guard', { dur:0.24 });
  hold(g, atk, def, 'windupSide', 'guard', 0.1);
  rolePush(g, atk, def, 'spinSlash', 'blockMid', {
    dur:0.34, stepAtk:closeStep(g), turnAtk:true, contact:contactAt(g,def), spark:20,
    shake:[4,0.2], sfx:'clash', hitstop:0.04, cam:{z:1.18, focus:0.5}
  });
  rolePush(g, atk, def, 'guard', 'stagger', { dur:0.26, stepDef:-20 });
  settle(g, atk, def);
}

/* Two turns run together, then the blow that was hiding behind them. */
function mSpinCombo(g, atk, def){
  rolePush(g, atk, def, 'windupSide', 'guard', { dur:0.22 });
  rolePush(g, atk, def, 'spinSlash', 'blockMid', {
    dur:0.3, stepAtk:16, turnAtk:true, contact:contactAt(g,def), spark:15,
    shake:[3,0.16], sfx:'clash', cam:{z:1.16, focus:0.5}
  });
  rolePush(g, atk, def, 'spinSlash', 'blockHigh', {
    dur:0.28, stepAtk:10, turnAtk:true, contact:contactAt(g,def), spark:15,
    shake:[3,0.16], sfx:'clash'
  });
  rolePush(g, atk, def, 'strikeAcross', 'stagger', {
    dur:0.22, stepDef:-26, contact:contactAt(g,def), spark:24,
    shake:[5,0.24], sfx:'clash', hitstop:0.05
  });
  settle(g, atk, def);
}

/* A turn made as a defence: the parry travels round the thrust and comes
   out on the other side of it. */
function mSpinParry(g, atk, def){
  rolePush(g, atk, def, 'windupSide', 'guardBack', { dur:0.22 });
  rolePush(g, atk, def, 'thrust', 'deflectSpin', {
    dur:0.28, stepAtk:24, turnDef:true, contact:contactAt(g,def), spark:12,
    shake:[2.6,0.14], sfx:'clash', cam:{z:1.2, focus:0.5}
  });
  rolePush(g, def, atk, 'riposte', 'stagger', {
    dur:0.2, stepAtk:14, stepDef:-24, contact:contactAt(g,atk), spark:20,
    shake:[4.5,0.22], sfx:'clash', hitstop:0.05
  });
  settle(g, atk, def);
}

function mKick(g, atk, def){
  swing(g, atk, def, 'strikeAcross', { windup:0.18, spark:12, stepAtk:14 });
  rolePush(g, atk, def, chance(0.4)?'spinKick':'kick', 'stagger', {
    dur:0.26, stepAtk:10, stepDef:-40, turnAtk:chance(0.4),
    contact:contactAt(g,def), shake:[5,0.24], sfx:'thud', hitstop:0.05
  });
  settle(g, atk, def);
}

function mForcePush(g, atk, def){
  rolePush(g, atk, def, 'forceCast', 'guard', { dur:0.34, cam:{z:1.1, focus:0.5} });
  hold(g, atk, def, 'forceCast', 'guardHigh', 0.16);
  rolePush(g, atk, def, 'forceCast', 'knockback', {
    dur:0.4, stepDef:-90, contact:0.25, spark:20,
    shake:[8,0.36], sfx:'force', flash:{color:'#ffffff', a:0.16}, hitstop:0.05
  });
  rolePush(g, atk, def, 'guard', 'stagger', { dur:0.3 });
  settle(g, atk, def);
}

function mForcePull(g, atk, def){
  rolePush(g, atk, def, 'forcePull', 'stagger', {
    dur:0.36, stepDef:56, contact:0.3, sfx:'force', cam:{z:1.14, focus:0.5}
  });
  rolePush(g, atk, def, 'strikeDown', 'blockHigh', {
    dur:0.18, stepAtk:6, contact:contactAt(g,def), spark:20, shake:[4,0.2], sfx:'clash', hitstop:0.04
  });
  settle(g, atk, def);
}

function mDeflect(g, atk, def, colorA){
  rolePush(g, atk, def, 'forceCast', 'deflect', {
    dur:0.44, contact:0.2, spark:18, shake:[4,0.26], sfx:'zap',
    flash:{color:colorA, a:0.15}, cam:{z:1.16, focus:0.5}
  });
  rolePush(g, atk, def, 'forceCast', 'deflectLow', {
    dur:0.42, contact:0.2, spark:22, shake:[5,0.3], sfx:'zap',
    flash:{color:'#ffffff', a:0.12}
  });
  rolePush(g, def, atk, 'deflect', 'stagger', {
    dur:0.3, stepDef:-26, contact:0.35, spark:24,
    shake:[6,0.3], sfx:'boom', hitstop:0.05
  });
  settle(g, atk, def);
}

/* A volley arrives from off-stage and both duelists deflect it. No sidearm,
   no new rig, no new generator path — bolts are particles with a stop line
   and `deflect` is a pose the engine already had. */
function mBlasterVolley(g, atk, def, color){
  // arrive from behind whoever is further out, so the bolts cross the pair
  const from = g.posOf(atk) < g.posOf(def) ? 1 : -1;
  const near = from > 0 ? (g.posOf(atk) > g.posOf(def) ? atk : def)
                        : (g.posOf(atk) < g.posOf(def) ? atk : def);
  rolePush(g, atk, def, 'guardHigh', 'guardHigh', { dur:0.3, cam:{z:1.04} });
  rolePush(g, atk, def, 'deflect', 'deflect', {
    dur:0.62, contact:0.08, cam:{z:1.12, focus:0.5},
    bolts:{ n:5, from, who:near, color }
  });
  rolePush(g, def, atk, 'deflectLow', 'deflect', {
    dur:0.56, contact:0.06, shake:[2.4,0.14],
    bolts:{ n:4, from:-from, who:(near===atk?def:atk), color }
  });
  rolePush(g, atk, def, 'guard', 'stagger', {
    dur:0.3, stepDef:-22, contact:0.4, spark:14, shake:[4,0.2], sfx:'zap', hitstop:0.04
  });
  settle(g, atk, def);
}

/* Lift something loose, hold it wobbling, throw it, and either cut it in
   half or wear it. The single most cinematic thing in this list. */
function mThrownProp(g, atk, def, defColor){
  const kind = choice(PROP_KEYS);
  rolePush(g, atk, def, 'liftCast', 'guard', {
    dur:0.48, contact:0.3, cam:{z:1.1, focus:0.5},
    prop:{ act:'lift', kind, who:atk }
  });
  hold(g, atk, def, 'liftCast', 'guardHigh', 0.34);       // the wobble
  rolePush(g, atk, def, 'throwWind', 'guardHigh', { dur:0.24 });
  rolePush(g, atk, def, 'throwRelease', 'guardHigh', {
    dur:0.3, contact:0.18, sfx:'force', cam:{z:1.14, focus:0.5},
    prop:{ act:'hurl', who:def }
  });
  if(chance(0.62)){

function mBreather(g, atk, def, weary){
  // Drift the pair back toward centre stage — otherwise a long duel slowly
  // migrates into a corner and stays there.
  const mid = (g.S.xA + g.S.xB)/2;
  const pull = -mid * 0.55;
  const b = {
    poseA: weary?'exhausted':'circleStep',
    poseB: weary?'exhausted':'circleStep',
    dur: weary?0.62:0.42,
    dxA: pull - 22*g.fwd('A'),
    dxB: pull - 22*g.fwd('B'),
    cam:{z:0.98}
  };
  g.push(b);
  settle(g, atk, def);
}

/* --- the planner --- */
function generateDuel(fighterA, fighterB, arena, opts){
  opts = opts || {};
  const tempo = clamp(((fighterA.speed + fighterB.speed)/2) * (opts.tempoMul||1), 0.6, 1.7);
  const g = makeBuilder(tempo);
  const winA = opts.winA;
  const comedic = !!(fighterA.comedic || fighterB.comedic);

  const roles = { A: fighterA, B: fighterB };
  function st(who, key){ return roles[who].style[key]; }

  /* --- opening --- */
  g.push({ poseA:'igniteStart', poseB:'igniteStart', dur:0.85, ease:'out',
           dxA:170, dxB:-170, cam:{z:0.96} });
  if(chance(0.35) && !comedic){
    g.push({ poseA:'salute', poseB:'salute', dur:0.6, cam:{z:1.0} });
  }
  g.push({ poseA:'ready', poseB:'ready', dur:0.38, ignite:true, sfx:'ignite',
           flash:{color:'#ffffff', a:0.12} });
  g.push({ poseA:'guard', poseB:'guard', dur:0.4 });

  /* --- body: build until we hit the target running time --- */
  const target = opts.targetSeconds !== undefined ? opts.targetSeconds : rand(20, 30);
  let elapsed = 0;
  for(const b of g.beats) elapsed += b.dur;

  let atk = chance(0.5) ? 'A' : 'B';
  let sinceBreather = 0;
  let guard = 0;

  while(elapsed < target && guard++ < 90){
    const def = atk==='A' ? 'B' : 'A';
    const before = g.beats.length;
    const progress = clamp(elapsed/target, 0, 1);

    const pool = [
      { v:mProbe,       w: 1.4 - progress },
      { v:mExchange,    w: 2.6 },
      { v:mFlurry,      w: 0.7 + st(atk,'agg')*2.2 + progress },
      { v:mBindRiposte, w: 0.5 + st(def,'def')*2.0 },
      { v:mSaberLock,   w: 0.5 + progress*1.4 },
      { v:mSweepLeap,   w: 0.4 + st(def,'acro')*1.8 },
      { v:mDuckCounter, w: 0.6 + st(def,'acro')*1.2 },
      { v:mLeapOver,    w: (g.sep() > 240 && g.hasVaultRoom(atk) ? 0.2 + st(atk,'acro')*2.2 : 0) },
      { v:mSpinAttack,  w: 0.4 + st(atk,'flair')*1.6 },
      { v:mKick,        w: 0.5 + st(atk,'agg')*0.9 },
      { v:mForcePush,   w: st(atk,'force')*2.2 },
      { v:mForcePull,   w: st(atk,'force')*1.2 },
      { v:mDeflect,     w: (st(atk,'force') > 0.7 ? 1.4 : 0) },
      { v:mNearMiss,    w: 0.5 + progress*1.2 },
      { v:mTaunt,       w: comedic ? 1.6 : st(atk,'flair')*0.5 },

      /* --- added modules. Same shape, same weighting discipline: a weight
         derived from the fighters' own style values, and 0 when the
         geometry does not allow the move. --- */
      { v:mPress,        w: 0.4 + st(atk,'agg')*1.8 },
      { v:mStandoff,     w: 0.7 + (1-progress)*1.1 },
      { v:mSpinCombo,    w: st(atk,'flair')*1.3 + st(atk,'acro')*0.7 },
      { v:mSpinParry,    w: 0.3 + st(def,'def')*1.3 },
      { v:mSomersault,   w: 0.2 + st(def,'acro')*1.5 },
      { v:mHandspring,   w: 0.2 + st(def,'acro')*1.3 },
      { v:mAirStrike,    w: 0.2 + st(atk,'acro')*1.4 },
      { v:mDisarmRecall, w: 0.25 + st(atk,'agg')*0.6 },
      { v:mRoll,         w: (g.hasVaultRoom(def) ? 0.2 + st(def,'acro')*1.6 : 0) },
      // Measured at the tighter threshold this fired twice in sixty fights,
      // which is a module nobody will ever see. The guard is what matters
      // (there has to be a wall behind him and room in front); the exact
      // distance from the edge is just how close counts as backed up.
      { v:mWallKick,     w: (Math.abs(g.posOf(atk)) > ARENA_HALF-210 && g.hasVaultRoom(atk)
                              ? 0.8 + st(atk,'acro')*2.8 : 0) },
      { v:mBlasterVolley,w: Math.max(st(atk,'blaster'), st(def,'blaster'))*1.25 },
      { v:mThrownProp,   w: Math.max(st(atk,'force')-0.35, 0)*3.0 }
    ];

    const mod = weightedPick(pool);
    if(mod === mDeflect || mod === mBlasterVolley) mod(g, atk, def, roles[atk].glow);
    else if(mod === mThrownProp) mod(g, atk, def, roles[def].glow);
    else mod(g, atk, def);

    for(let i=before;i<g.beats.length;i++) elapsed += g.beats[i].dur;

    sinceBreather++;
    if(sinceBreather >= randInt(3,5) && elapsed < target - 3){
      mBreather(g, atk, def, progress > 0.6);
      for(let i=g.beats.length-2;i<g.beats.length;i++) elapsed += g.beats[i].dur;
      sinceBreather = 0;
    }

    // pressure passes to whoever is on the front foot
    if(chance(0.55)) atk = def;
  }

  /* --- climax --- */
  const win = winA ? 'A' : 'B';
  const lose = winA ? 'B' : 'A';
  const names = [fighterA.name, fighterB.name].sort().join('|');
  // Ned has to be the one holding the cocoa, so the gag only arms when he
  // is also the one who won.
  const cocoa = names === 'HOMER SIMPSON|NED FLANDERS' && roles[win].name === 'NED FLANDERS';
  const finishers = [
    { v:mFinishDisarm, w: 1.2 + roles[win].style.def*1.2 },
    { v:mFinishLock,   w: 1.4 },
    { v:mFinishForce,  w: roles[win].style.force*2.6 },
    { v:mFinishThrust, w: 1.0 + roles[win].style.agg*1.2 },
    { v:mFinishSpin,   w: 0.6 + roles[win].style.acro*2.0 },
    { v:mFinishDouble, w: comedic ? 2.2 : 0 },
    // The headline ending for that matchup — the usual one, not the only
    // one. At 7 it drew about a quarter of the time.
    { v:mFinishCocoa,  w: cocoa ? 13 : 0 }
  ];
  const fin = weightedPick(finishers);
  if(fin === mFinishForce) fin(g, win, lose, roles[win].glow);
  else fin(g, win, lose);

  /* --- resolve --- */
  const collapse = chance(0.5) ? 'kneel' : 'deathFall';
  const rb = {
    dur:0.9, ease:'out', resolve:true, cam:{z:1.12, focus:0.5}, slow:0.85, sfx:'thud'
  };
  rb['pose'+win] = 'finishWin';
  rb['pose'+lose] = 'finishLose';
  rb['dx'+win] = 10 * g.fwd(win);
  rb['dx'+lose] = -18 * g.fwd(lose);
  g.push(rb);

  const rb2 = { dur:1.1, ease:'out', cam:{z:1.06, focus:0.5} };
  rb2['pose'+win] = 'finishWin';
  rb2['pose'+lose] = collapse;
  g.push(rb2);

  return g.beats;
}

/* ============================== FIGHT ASSEMBLY ============================== */
let lastKey = "";

/* Dev-only pin, set from ?a=&b=&arena=. It is a guard in front of the
   selection, not a change to it — with no query string the randomiser is
   untouched. */
let FORCE = null;

function buildFight(){
  let aKey, bKey, arenaKey, winner;

  if(FORCE){
    aKey = FORCE.a; bKey = FORCE.b;
    arenaKey = FORCE.arena || choice(ARENA_KEYS);
    winner = FORCE.winner || 'random';
  } else if(chance(RANDOM_MATCHUP_CHANCE)){
    const picks = shuffle(FIGHTER_KEYS).slice(0,2);
    aKey = picks[0]; bKey = picks[1];
    arenaKey = choice(ARENA_KEYS);
    winner = 'random';
  } else {
    const m = choice(MATCHUPS);
    aKey = m.a; bKey = m.b; arenaKey = m.arena; winner = m.winner || 'random';
  }

  const key = aKey+'|'+bKey;
  if(!FORCE && key === lastKey) return buildFight(); // never repeat back to back
  lastKey = key;

  const A = FIGHTERS[aKey], B = FIGHTERS[bKey];
  const arena = ARENAS[arenaKey];
  let winA = winner === 'A' ? true : winner === 'B' ? false : chance(0.5);

  // Homer vs Ned resolves one way round, because its ending only works one
  // way round — Ned is the one holding the cocoa. The curated matchup
  // already said so; this covers the random pairing and the pinned one,
  // which were both coin flips and disarmed the gag half the time.
  if(aKey === 'ned' && bKey === 'homer') winA = true;
  if(aKey === 'homer' && bKey === 'ned') winA = false;

  const length = weightedPick([
    { v:{ t:rand(15,20), n:'SHORT'    }, w:1 },
    { v:{ t:rand(21,29), n:'STANDARD' }, w:2.4 },
    { v:{ t:rand(30,40), n:'EXTENDED' }, w:1.2 }
  ]);

  const beats = generateDuel(A, B, arena, { winA, targetSeconds: length.t });

  return {
    A, B, arena, arenaKey, beats, winA,
    lengthLabel: length.n,
    jitter: (A.jitter + B.jitter)/2,
    comedic: !!(A.comedic || B.comedic)
  };
}

/* ============================== PLAYER STATE ============================== */
const state = {
  fight: null,
  beatIdx: 0,
  beatT: 0,
  prevPoseA: POSES.igniteStart,
  prevPoseB: POSES.igniteStart,
  poseA: POSES.igniteStart,
  poseB: POSES.igniteStart,
  baseXA: -300, baseXB: 300,
  dxA: 0, dxB: 0, dyA: 0, dyB: 0,
  spinA: 0, spinB: 0,
  turnA: 1, turnB: 1,
  dirA: 1, dirB: -1,
  extendA: 0, extendB: 0,
  playing: true,
  phase: 'playing',
  holdT: 0,
  hitstop: 0,
  timeScale: 1,
  trailA: [], trailB: [],
  lastTipA: null, lastTipB: null,
  speedA: 0, speedB: 0,
  gag: null,                 // a short line over a fighter's head
  cocoa: 0,                  // Ned's mug, 0..1
  hitA: 0, hitB: 0,          // white silhouette flash, decays fast
  blockA: 0, blockB: 0,      // smoothed "is parrying" — Ned's halo reads it
  hpA: 1, hpB: 1,            // displayed health, eased toward the plan
  hpFlashA: 0, hpFlashB: 0,
  clock: 0
};

/* A fighter stands in their OWN guard. The generator still only ever says
   'guard'; which guard that is belongs to the character, not to the
   choreography, so it is resolved here at playback. This is most of what
   makes a duelist recognisable while nothing is happening. */
function poseFor(char, name){
  if(name === 'guard' && char && char.guard && POSES[char.guard]) return POSES[char.guard];
  return POSES[name];
}

/* ---- health, read out of the plan and never simulated --------------------
   The generator has already decided who wins and emitted every beat. The
   bars are an ornament: they read damage back OUT of the finished beat list
   so nothing about them can feed into fight logic. */
const HURT_WEIGHT  = { stagger:1, knockback:1.5, wounded:1.7, exhausted:0.4,
                       disarmLose:2.2, finishLose:3.2 };
const BLOCK_WEIGHT = { blockHigh:0.22, blockMid:0.22, blockLow:0.22, parry:0.14,
                       deflect:0.2, lockStrainB:0.45, guardHigh:0.1, pressBack:0.3 };

function planHealth(beats, winA){
  const ev = { A:[], B:[] }, tot = { A:0, B:0 };
  beats.forEach(function(b, i){
    for(const who of ['A','B']){
      const p = b['pose'+who];
      const hurt = HURT_WEIGHT[p] || 0;
      const chip = BLOCK_WEIGHT[p] || 0;
      if(!hurt && !chip) continue;
      const mag = hurt
        ? hurt * (1 + (b.spark||0)/26 + (b.shake ? b.shake[0]/7 : 0))
        : chip * (1 + (b.spark||0)/40);
      ev[who].push([i, mag]); tot[who] += mag;
    }
  });
  const loser = winA ? 'B' : 'A', winner = winA ? 'A' : 'B';
  // The loser lands on zero at the finisher; the winner keeps 20–45%. A duel
  // whose winner walks away untouched reads wrong.
  const end = { [loser]:0, [winner]:rand(0.20, 0.45) };
  const out = { A:new Array(beats.length), B:new Array(beats.length) };
  for(const who of ['A','B']){
    const drop = 1 - end[who];
    const scale = tot[who] > 0.0001 ? drop/tot[who] : 0;
    let hp = 1, k = 0;
    for(let i=0;i<beats.length;i++){
      while(k < ev[who].length && ev[who][k][0] === i){ hp -= ev[who][k][1]*scale; k++; }
      out[who][i] = clamp(hp, 0, 1);
    }
  }
  return out;
}

let titleTimer = null;

function startFight(){
  const f = buildFight();
  f.hp = planHealth(f.beats, f.winA);
  state.fight = f;
  state.beatIdx = -1;
  state.beatT = 0;
  state.prevPoseA = POSES.igniteStart;
  state.prevPoseB = POSES.igniteStart;
  state.poseA = POSES.igniteStart;
  state.poseB = POSES.igniteStart;
  state.baseXA = -300; state.baseXB = 300;
  state.dxA = state.dxB = state.dyA = state.dyB = 0;
  state.spinA = state.spinB = 0;
  state.turnA = state.turnB = 1;
  state.dirA = 1; state.dirB = -1;
  state.extendA = state.extendB = 0;
  state.phase = 'playing';
  state.holdT = 0;
  state.hitstop = 0;
  state.hitA = state.hitB = 0;
  state.blockA = state.blockB = 0;
  state.gag = null; state.cocoa = 0;
  state.segsA = state.segsB = null;
  Sound.setRoom(f.arenaKey);
  state.hpA = state.hpB = 1;
  state.hpFlashA = state.hpFlashB = 0;
  state.trailA.length = 0; state.trailB.length = 0;
  state.lastTipA = state.lastTipB = null;
  particles = particles.filter(p => p.type === 'ambient');
  bolts.length = 0; props.length = 0; decals.length = 0;
  flash.a = 0;
  shakeT = 0; shakeVX = shakeVY = 0;
  resetCamera();
  nextBeat();

  document.getElementById('namesLine').textContent = f.A.name + "  vs  " + f.B.name;
  document.getElementById('arenaLine').textContent = f.arena.label + " · " + f.lengthLabel;
  const tc = document.getElementById('titleCard');
  tc.classList.add('show');
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('fightLabel').textContent =
    f.A.name.split(' ')[0] + " / " + f.B.name.split(' ')[0];
  if(titleTimer) clearTimeout(titleTimer);
  titleTimer = setTimeout(function(){ tc.classList.remove('show'); }, 2400);
}

function nextBeat(){
  const f = state.fight;
  state.beatIdx++;
  state.beatT = 0;

  if(state.beatIdx > 0){
    const prev = f.beats[state.beatIdx-1];
    if(prev){
      state.prevPoseA = poseFor(f.A, prev.poseA) || state.prevPoseA;
      state.prevPoseB = poseFor(f.B, prev.poseB) || state.prevPoseB;
    }
  }

  if(state.beatIdx >= f.beats.length){
    state.phase = 'holding';
    state.holdT = 0;
    const card = document.getElementById('resultCard');
    card.innerHTML = (f.winA ? f.A.name : f.B.name) + " WINS" +
      '<span class="sub">' + f.arena.label + '</span>';
    card.classList.add('show');
    Sound.silenceHums();
  }
}

function easeFor(beat, t){
  switch(beat.ease){
    case 'out':  return easeOutQuad(t);
    case 'in':   return easeInCubic(t);
    case 'back': return easeOutBack(t);
    default:     return easeInOutCubic(t);
  }
}

/* Impacts land ON the contact frame, not when the beat completes. Before
   this the clash sound and its sparks arrived after the swing had already
   finished, which is most of why nothing felt like it connected. */
/* Closest points between two segments. The second solve divides by v·v —
   getting that wrong is a classic here, and it reports blades that provably
   cross as being sixteen units apart, which makes a parry throw no sparks. */
function segPair(p1, p2, p3, p4){
  const ux=p2.x-p1.x, uy=p2.y-p1.y;
  const vx=p4.x-p3.x, vy=p4.y-p3.y;
  const wx=p1.x-p3.x, wy=p1.y-p3.y;
  const a=ux*ux+uy*uy, b=ux*vx+uy*vy, c=vx*vx+vy*vy;
  const d=ux*wx+uy*wy, e=vx*wx+vy*wy;
  const den = a*c - b*b;
  let sc, tc;
  if(den < 1e-8){ sc = 0; tc = c > 1e-8 ? e/c : 0; }
  else { sc = (b*e - c*d)/den; tc = (a*e - b*d)/den; }
  sc = clamp(sc, 0, 1);
  tc = clamp(c > 1e-8 ? (b*sc + e)/c : 0, 0, 1);
  sc = clamp(a > 1e-8 ? (b*tc - d)/a : 0, 0, 1);
  const P = { x:p1.x+ux*sc, y:p1.y+uy*sc };
  const Q = { x:p3.x+vx*tc, y:p3.y+vy*tc };
  return { onA:P, onB:Q, p:{ x:(P.x+Q.x)/2, y:(P.y+Q.y)/2 },
           d:Math.hypot(P.x-Q.x, P.y-Q.y) };
}

const STRIKE_POSES = { strikeDown:1, strikeAcross:1, strikeUp:1, thrust:1,
                       spinSlash:1, sweepLow:1, riposte:1, airStrike:1,
                       pressFwd:1, lockPush:1, lockStrainF:1 };

/* WHERE a burst goes. It used to be the midpoint between the two fighters
   at a fixed height, which is a point in clear air that touches neither
   sword: at f3 of a strike the sparks were a body-width from the blade that
   caused them. Sparks now come off real geometry —
     blades crossing  -> the point where they cross
     one blade swung  -> that blade, nearest the fighter being hit
     no blade at all  -> the victim's chest (a kick, a force push)
   and only fall back to the old midpoint when nothing is drawn yet. */
/* The blade and body of one fighter AS OF THIS FRAME, rebuilt from the live
   pose rather than read back from the last render. */
function liveGeom(who){
  const f = state.fight;
  if(!f) return null;
  const char = who === 'A' ? f.A : f.B;
  const base = who === 'A' ? state.poseA : state.poseB;
  const spin = who === 'A' ? state.spinA : state.spinB;
  const pose = Object.assign({}, base, { rot:(base.rot||0) + spin });
  const dir  = who === 'A' ? state.dirA*state.turnA : state.dirB*state.turnB;
  const x    = worldX(who === 'A' ? state.baseXA + state.dxA : state.baseXB + state.dxB);
  const yOff = who === 'A' ? state.dyA : state.dyB;
  const j = computeJoints(x, yOff, dir, pose, char);
  return { segs: weaponGeom(j, pose, char, dir).segs,
           body: { x:(j.hip.x+j.neck.x)/2, y:(j.hip.y+j.neck.y)/2 } };
}

function impactPoint(beat){
  const gA = liveGeom('A'), gB = liveGeom('B');
  const segsA = gA && gA.segs, segsB = gB && gB.segs;
  const atkIsA = !!STRIKE_POSES[beat.poseA];
  const atkIsB = !!STRIKE_POSES[beat.poseB];

  if(segsA && segsA.length && segsB && segsB.length){
    let best = null;
    for(const a of segsA) for(const b of segsB){
      const r = segPair(a.a, a.b, b.a, b.b);
      if(!best || r.d < best.d) best = r;
    }
    if(best && best.d < 46*rigScale){
      // Near enough that a parry is what happened. Spawn on the ATTACKER's
      // blade, not at the midpoint of the gap: measured, the two blades sit
      // a median 34px apart at contact, so the midpoint is 17px from either
      // sword — a burst in the air between them, which is the whole bug this
      // function exists to fix. By construction the sparks now come off the
      // sword that just swung.
      if(atkIsA && !atkIsB) return best.onA;
      if(atkIsB && !atkIsA) return best.onB;
      return best.p;
    }
  }
  // one of them swung: put it on that blade, at the end nearest the victim
  const segs = atkIsA ? segsA : atkIsB ? segsB : null;
  const victim = atkIsA ? (gB && gB.body) : atkIsB ? (gA && gA.body) : null;
  if(segs && segs.length && victim){
    const sg = segs[0];
    let best = null;
    for(let i=0;i<=6;i++){
      const q = { x:lerp(sg.a.x, sg.b.x, i/6), y:lerp(sg.a.y, sg.b.y, i/6) };
      const dd = Math.hypot(q.x-victim.x, q.y-victim.y);
      if(!best || dd < best.d) best = { q, d:dd };
    }
    return best.q;
  }
  if(victim) return victim;                       // a kick, a shove
  const xA = worldX(state.baseXA + state.dxA), xB = worldX(state.baseXB + state.dxB);
  const c = beat.contact !== undefined ? beat.contact : 0.5;
  return { x:lerp(xA, xB, c), y:groundY - 132*rigScale };
}

function fireBeatEffects(beat){
  const f = state.fight;
  const xA = worldX(state.baseXA + state.dxA), xB = worldX(state.baseXB + state.dxB);
  const hit = impactPoint(beat);
  const cx = hit.x, cy = hit.y;
  // read by the bench to measure burst placement against real geometry
  state.lastImpact = { x:hit.x, y:hit.y, sfx:beat.sfx, spark:beat.spark };

  if(beat.spark){
    // Sparks spray along the contact normal — the line between the two
    // fighters — rather than radially, so they read as struck metal.
    const norm = Math.atan2(0, xB-xA) + Math.PI/2;
    emitSpark(cx, cy, f.A.glow, f.B.glow, beat.spark, beat.spark/34, norm);
    if(beat.spark >= 24) emitRing(cx, cy, '#ffffff', 10);
    if(beat.spark >= 18) addDecal(cx, groundY, beat.spark/40);
  }
  if(beat.shake) triggerShake(beat.shake[0], beat.shake[1], xB-xA);
  if(beat.flash) triggerFlash(beat.flash.color, beat.flash.a, 3.2);
  if(beat.hitstop && !prefersReducedMotion) state.hitstop = beat.hitstop;

  // whoever arrives in a reaction pose is the one who just got hit
  const power = clamp((beat.spark||10)/34, 0.12, 1);
  if(HURT_WEIGHT[beat.poseA]) state.hitA = 1;
  if(HURT_WEIGHT[beat.poseB]) state.hitB = 1;

  if(beat.sfx === 'clash'){ Sound.clash(power); Sound.sizzle(beat.spark||10); }
  else if(beat.sfx === 'boom'){ Sound.boom(); Sound.sub(1); }
  else if(beat.sfx === 'thud'){ Sound.bodyHit(power); }
  else if(beat.sfx === 'land'){ Sound.landing(power); }
  else if(beat.sfx === 'kneel'){ Sound.kneel(); }
  else if(beat.sfx === 'zap'){ Sound.zap(); }
  else if(beat.sfx === 'force'){ Sound.force(); Sound.sub(0.8); }
  else if(beat.sfx === 'ignite'){ Sound.ignite(); }
  if(beat.shake && beat.shake[0] >= 6) Sound.sub(clamp(beat.shake[0]/10, 0.3, 1));

  if(beat.sfx === 'thud' || beat.sfx === 'land'){
    const who = beat.arcA ? xA : beat.arcB ? xB : cx;
    emitDust(who, groundY, f.arena.ambientColor, 10);
    addDecal(who, groundY, 0.4);
  }
  if(beat.bolts) fireVolley(beat);
  if(beat.prop) propBeat(beat, cx);
  if(beat.cocoa) state.cocoa = 1;
  if(beat.gag) state.gag = { text:beat.gag.text, who:beat.gag.who,
                             big:!!beat.gag.big, t:0, hold:beat.gag.hold || 1.5 };
}

/* ============================== MAIN LOOP ============================== */
let lastTime = performance.now();

function tick(dt){
  const f = state.fight;
  if(!f) return;

  state.clock += dt;

  if(state.hitstop > 0){ state.hitstop -= dt; dt = 0; }

  const beat = f.beats[state.beatIdx];
  const slow = beat && beat.slow ? beat.slow : 1;
  const scaled = dt * (prefersReducedMotion ? 1 : slow);

  updateAmbient(dt, f.arena);
  updateParticles(dt);
  updateBolts(dt);
  updateProps(dt);
  updateDecals(dt);
  if(shakeT > 0){ shakeT -= dt; if(shakeT <= 0) shakeMag = 0; }
  if(flash.a > 0) flash.a = Math.max(0, flash.a - flash.decay*dt);
  state.hitA = Math.max(0, state.hitA - dt*7);
  state.hitB = Math.max(0, state.hitB - dt*7);
  state.hpFlashA = Math.max(0, state.hpFlashA - dt*4);
  state.hpFlashB = Math.max(0, state.hpFlashB - dt*4);
  if(state.gag){ state.gag.t += dt; if(state.gag.t > state.gag.hold) state.gag = null; }

  if(state.phase === 'playing' && beat){
    state.beatT += scaled;
    const rawT = clamp(state.beatT/beat.dur, 0, 1);
    const t = easeFor(beat, rawT);

    const targetA = poseFor(f.A, beat.poseA) || state.prevPoseA;
    const targetB = poseFor(f.B, beat.poseB) || state.prevPoseB;
    const pA = lerpPose(state.prevPoseA, targetA, t);
    const pB = lerpPose(state.prevPoseB, targetB, t);

    // idle jitter so the figures never look frozen
    const jt = f.jitter;
    if(jt > 0.05){
      const w = state.clock;
      pA.armR.shoulder += Math.sin(w*7.1 + 1)*jt;
      pA.armL.shoulder += Math.sin(w*6.3 + 2)*jt*0.6;
      pB.armR.shoulder += Math.sin(w*7.6 + 3)*jt;
      pB.armL.shoulder += Math.sin(w*6.7 + 4)*jt*0.6;
    }
    if(f.comedic){
      pA.hipBob += Math.sin(state.clock*3.4)*3.5;
      pB.hipBob += Math.sin(state.clock*3.4 + 1.5)*3.5;
    }

    if(beat.ignite){ pA.weaponExtend = t; pB.weaponExtend = t; }

    state.poseA = pA; state.poseB = pB;
    state.dxA = beat.dxA ? lerp(0, beat.dxA, t) : 0;
    state.dxB = beat.dxB ? lerp(0, beat.dxB, t) : 0;
    // Arcs are vertical rig distance, so they scale with the rig, not with
    // the raw pixel height — otherwise a short panel launches people out of
    // the top of the frame.
    state.dyA = beat.arcA ? -beat.arcA*rigScale*Math.sin(Math.PI*rawT) : 0;
    state.dyB = beat.arcB ? -beat.arcB*rigScale*Math.sin(Math.PI*rawT) : 0;
    state.spinA = beat.spinA ? beat.spinA*rawT : 0;
    state.spinB = beat.spinB ? beat.spinB*rawT : 0;
    state.turnA = beat.turnA ? turnFactor(rawT) : 1;
    state.turnB = beat.turnB ? turnFactor(rawT) : 1;

    const wantBlockA = BLOCK_WEIGHT[beat.poseA] ? 1 : 0;
    const wantBlockB = BLOCK_WEIGHT[beat.poseB] ? 1 : 0;
    state.blockA = lerp(state.blockA, wantBlockA, 1-Math.exp(-dt*9));
    state.blockB = lerp(state.blockB, wantBlockB, 1-Math.exp(-dt*9));

    // health bars ease toward the value planned for this beat
    if(f.hp){
      const tA = f.hp.A[state.beatIdx], tB = f.hp.B[state.beatIdx];
      if(tA !== undefined && tA < state.hpA - 0.004) state.hpFlashA = 1;
      if(tB !== undefined && tB < state.hpB - 0.004) state.hpFlashB = 1;
      const kk = 1-Math.exp(-dt*5);
      if(tA !== undefined) state.hpA = lerp(state.hpA, tA, kk);
      if(tB !== undefined) state.hpB = lerp(state.hpB, tB, kk);
    }

    // camera target
    const camZ = beat.cam && beat.cam.z ? beat.cam.z : 1;
    const focus = beat.cam && beat.cam.focus !== undefined ? beat.cam.focus : 0.5;
    const fx = lerp(worldX(state.baseXA + state.dxA), worldX(state.baseXB + state.dxB), focus);
    cam.tz = prefersReducedMotion ? 1 : camZ;
    cam.tx = prefersReducedMotion ? W*0.5 : lerp(W*0.5, fx, 0.65);
    cam.ty = prefersReducedMotion ? H*0.55 : groundY - 128*rigScale;

    const fireAt = beat.contact !== undefined ? beat.contact : 1;
    if(!beat.fired && rawT >= fireAt){ beat.fired = true; fireBeatEffects(beat); }

    if(rawT >= 1){
      state.baseXA += beat.dxA || 0;
      state.baseXB += beat.dxB || 0;
      state.dxA = state.dxB = 0;
      state.dyA = state.dyB = 0;
      state.spinA = state.spinB = 0;
      state.turnA = state.turnB = 1;
      if(beat.swap){ state.dirA *= -1; state.dirB *= -1; }
      nextBeat();
    }
  } else if(state.phase === 'holding'){
    state.holdT += dt;
    cam.tz = prefersReducedMotion ? 1 : 1.04;
    if(state.holdT > 2.6) startFight();
  }

  const k = 1 - Math.exp(-dt*5.5);
  cam.x = lerp(cam.x, cam.tx, k);
  cam.y = lerp(cam.y, cam.ty, k);
  cam.z = lerp(cam.z, cam.tz, k);
}

function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - lastTime)/1000;
  lastTime = now;
  dt = Math.min(dt, 0.05);
  if(!state.playing || !panelVisible) dt = 0;
  if(!state.fight) return;
  if(!panelVisible) return;   // off-screen panels cost nothing at all
  tick(dt);
  render(dt);
}

/* world -> screen, for chrome that must NOT scale with the camera */
function project(p){
  return { x:(p.x - cam.x)*cam.z + W*0.5, y:(p.y - cam.y)*cam.z + H*0.55 };
}

/* ---- nametags and health bars -------------------------------------------
   A reader who lands on the page mid-duel has no idea who these two are.
   The title card had already faded; the tag is the fix. It is deliberately
   instrument-small — the silhouettes are what should be carrying this, and
   a label that competes with the fight has taken over the fight. */
const TAG_MIN_W = 500;
function drawTag(out, char, hp, hpFlash, fade){
  if(W < TAG_MIN_W || fade <= 0.01) return;
  const p = project({ x:out.head.x, y:out.head.y - 34*out.S });
  if(p.y < 14 || p.y > H-8) return;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.globalAlpha = fade;

  ctx.font = '600 9px "JetBrains Mono", ui-monospace, monospace';
  if('letterSpacing' in ctx) ctx.letterSpacing = '1.4px';
  ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 4;
  ctx.fillStyle = 'rgba(232,232,240,0.66)';
  ctx.fillText(char.name, p.x, p.y);
  ctx.shadowBlur = 0;
  if('letterSpacing' in ctx) ctx.letterSpacing = '0px';

  const bw = 46, bh = 3, bx = p.x - bw/2, by = p.y + 5;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = char.glow;
  ctx.globalAlpha = fade*0.82;
  ctx.fillRect(bx, by, bw*clamp(hp,0,1), bh);
  if(hpFlash > 0.01){
    ctx.globalAlpha = fade*hpFlash;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(bx, by, bw*clamp(hp,0,1), bh);
  }
  ctx.restore();
}

/* A short line over a fighter's head. Only the cocoa ending uses it today,
   but it is generic on purpose — a taunt with a word on it is the obvious
   next customer, and a one-off would have to be rebuilt for that. */
function drawGag(outA, outB){
  const g = state.gag;
  if(!g) return;
  const out = g.who === 'A' ? outA : outB;
  const p = project({ x:out.head.x, y:out.head.y - 62*out.S });
  const t = g.t/g.hold;
  const a = clamp(Math.min(t*6, (1-t)*5), 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 6;
  if(g.big){
    ctx.font = '700 ' + Math.round(clamp(W*0.032, 20, 46)) + 'px "Bebas Neue", sans-serif';
    if('letterSpacing' in ctx) ctx.letterSpacing = '4px';
    ctx.fillStyle = '#ffd966';
  } else {
    ctx.font = '600 12px "JetBrains Mono", ui-monospace, monospace';
    if('letterSpacing' in ctx) ctx.letterSpacing = '1.6px';
    ctx.fillStyle = 'rgba(238,238,244,0.9)';
  }
  ctx.fillText(g.text, p.x, p.y - (1-a)*8);
  if('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  ctx.restore();
}

/* The mug. Drawn in the winner's off hand, in world space, so it travels
   with him — it is a prop the choreography is holding, not an overlay. */
function drawCocoa(out){
  if(state.cocoa <= 0.01) return;
  const S = out.S, h = out.handL;
  ctx.save();
  ctx.globalAlpha = clamp(state.cocoa, 0, 1);
  ctx.translate(h.x, h.y - 4*S);
  ctx.fillStyle = '#efe7d8';
  ctx.beginPath();
  ctx.moveTo(-7*S, -6*S); ctx.lineTo(7*S, -6*S);
  ctx.lineTo(5.4*S, 6*S); ctx.lineTo(-5.4*S, 6*S);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#efe7d8'; ctx.lineWidth = 1.8*S;
  ctx.beginPath(); ctx.arc(9.5*S, -0.5*S, 4.2*S, -1.1, 1.1); ctx.stroke();
  ctx.fillStyle = '#6b4226';
  ctx.fillRect(-6.2*S, -6*S, 12.4*S, 2.4*S);
  // steam
  ctx.globalAlpha = clamp(state.cocoa, 0, 1)*0.5;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2*S;
  for(let i=0;i<2;i++){
    const o = (i?3:-3)*S, w = clock()*2.4 + i;
    ctx.beginPath();
    ctx.moveTo(o, -8*S);
    ctx.quadraticCurveTo(o + Math.sin(w)*4*S, -14*S, o + Math.sin(w+1)*2*S, -20*S);
    ctx.stroke();
  }
  ctx.restore();
}

function render(dt){
  const f = state.fight;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBackground(f.arena, state.clock*1000);
  drawParticles('ambient');

  ctx.save();
  if(shakeT > 0){
    // oscillate along the blow's axis and decay with what's left of it —
    // a constant offset would read as the camera having moved
    const amp = shakeMag*Math.min(1, shakeT*6)*Math.sin(state.clock*104);
    ctx.translate(shakeVX*amp, shakeVY*amp);
  }
  ctx.translate(W*0.5, H*0.55);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);

  const poseA = Object.assign({}, state.poseA, { rot: (state.poseA.rot||0) + state.spinA });
  const poseB = Object.assign({}, state.poseB, { rot: (state.poseB.rot||0) + state.spinB });

  const xA = worldX(state.baseXA + state.dxA);
  const xB = worldX(state.baseXB + state.dxB);

  drawDecals();
  drawProps('back');
  drawTrail(state.trailA, f.A.glow);
  drawTrail(state.trailB, f.B.glow);

  const outA = drawFigure(xA, state.dyA, state.dirA*state.turnA, poseA, f.A, -state.dyA,
                          { hit:state.hitA, blocking:state.blockA, effort:state.speedA });
  const outB = drawFigure(xB, state.dyB, state.dirB*state.turnB, poseB, f.B, -state.dyB,
                          { hit:state.hitB, blocking:state.blockB, effort:state.speedB });

  // Published for the bench only — impact placement rebuilds this itself
  // from the live pose, because last frame's geometry is not where the
  // blade is when the blow lands.
  state.segsA = outA.segs; state.segsB = outB.segs;

  if(dt > 0){
    pushTrail(state.trailA, outA.hand, outA.tip);
    pushTrail(state.trailB, outB.hand, outB.tip);
    if(state.lastTipA){
      const d = Math.hypot(outA.tip.x-state.lastTipA.x, outA.tip.y-state.lastTipA.y);
      state.speedA = lerp(state.speedA, clamp(d/(dt*2600), 0, 1), 0.4);
    }
    if(state.lastTipB){
      const d = Math.hypot(outB.tip.x-state.lastTipB.x, outB.tip.y-state.lastTipB.y);
      state.speedB = lerp(state.speedB, clamp(d/(dt*2600), 0, 1), 0.4);
    }
    state.lastTipA = { x:outA.tip.x, y:outA.tip.y };
    state.lastTipB = { x:outB.tip.x, y:outB.tip.y };
    Sound.hum(0, state.speedA * state.poseA.weaponExtend, f.A, xA/W);
    Sound.hum(1, state.speedB * state.poseB.weaponExtend, f.B, xB/W);
  } else {
    if(state.trailA.length) state.trailA.shift();
    if(state.trailB.length) state.trailB.shift();
  }

  drawCocoa(state.fight.winA ? outA : outB);
  drawBolts();
  drawProps('front');
  drawParticles('action');
  ctx.restore();

  // chrome, outside the camera transform so it never scales with the zoom
  const zoomFade = clamp(1 - (cam.z - 1.16)/0.22, 0, 1);
  const tagFade = (state.phase === 'holding' ? 0 : 1) * zoomFade;
  drawTag(outA, f.A, state.hpA, state.hpFlashA, tagFade);
  drawTag(outB, f.B, state.hpB, state.hpFlashB, tagFade);
  drawGag(outA, outB);

  if(flash.a > 0.002){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(flash.a, 0, 0.55);
    ctx.fillStyle = flash.color;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

/* ============================== CONTROLS ============================== */
const playBtn = document.getElementById('playBtn');
const soundBtn = document.getElementById('soundBtn');
const skipBtn = document.getElementById('skipBtn');

playBtn.addEventListener('click', function(){
  state.playing = !state.playing;
  playBtn.textContent = state.playing ? '⏸ PAUSE' : '▶ PLAY';
  if(!state.playing) Sound.silenceHums();
});

skipBtn.addEventListener('click', function(){ startFight(); });

soundBtn.addEventListener('click', function(){
  const on = Sound.toggle();
  soundBtn.classList.toggle('on', !!on);
  soundBtn.textContent = on ? '♪ SOUND ON' : '♪ SOUND';
  if(!on) Sound.silenceHums();
});

document.addEventListener('keydown', function(e){
  if(e.key === ' '){ e.preventDefault(); playBtn.click(); }
  else if(e.key === 's' || e.key === 'S'){ skipBtn.click(); }
  else if(e.key === 'm' || e.key === 'M'){ soundBtn.click(); }
});

document.addEventListener('visibilitychange', function(){
  if(document.hidden) Sound.silenceHums();
});

/* ============================== COSTUME CONTACT SHEET ==============================
   `?sheet=1` draws every fighter side by side, each in their own signature
   guard, at the size they actually render at. This is the tool for the one
   question that matters about the costumes — can you tell them apart at a
   glance, in a row, without labels — and it is the only honest way to
   answer it, because comparing them one duel at a time cannot. */
function drawSheet(){
  const keys = FIGHTER_KEYS;
  const cols = Math.max(3, Math.min(8, Math.floor(W/175)));
  const rows = Math.ceil(keys.length/cols);
  const cw = W/cols, ch = H/rows;
  const savedGround = groundY, savedRig = rigScale;
  rigScale = clamp(Math.min(ch/300, cw/190), 0.34, 1.1);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0a12'); bg.addColorStop(1,'#040407');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  keys.forEach(function(k, i){
    const char = FIGHTERS[k];
    const cxp = (i%cols + 0.5)*cw;
    const cyp = (Math.floor(i/cols) + 1)*ch;
    groundY = cyp - ch*0.16;

    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.045)'; ctx.lineWidth = 1;
    ctx.strokeRect((i%cols)*cw + 0.5, cyp-ch + 0.5, cw-1, ch-1);
    ctx.restore();

    drawFigure(cxp, 0, 1, poseFor(char, 'guard'), char, 0, { blocking:0.6, effort:0.4 });

    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '600 9px "JetBrains Mono", ui-monospace, monospace';
    if('letterSpacing' in ctx) ctx.letterSpacing = '1.2px';
    ctx.fillStyle = 'rgba(226,226,236,0.55)';
    ctx.fillText(char.name, cxp, cyp - 12);
    ctx.fillStyle = 'rgba(150,150,166,0.5)';
    ctx.font = '400 8px "JetBrains Mono", ui-monospace, monospace';
    ctx.fillText(char.guard.replace('guard','') || 'Shii-Cho', cxp, cyp - 2);
    if('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    ctx.restore();
  });

  groundY = savedGround; rigScale = savedRig;
}

/* ============================== INIT ============================== */
const Q = new URLSearchParams(location.search);
if(Q.get('a') && Q.get('b') && FIGHTERS[Q.get('a')] && FIGHTERS[Q.get('b')]){
  FORCE = { a:Q.get('a'), b:Q.get('b'), arena:Q.get('arena') || null,
            winner:Q.get('win') || null };
}
document.getElementById('loading').style.display = 'none';

if(Q.has('sheet')){
  document.getElementById('controls').style.display = 'none';
  document.getElementById('vignette').style.display = 'none';
  const paint = function(){ drawSheet(); };
  if(window.ResizeObserver) new ResizeObserver(paint).observe(panel);
  // Fonts change the label metrics, so redraw once they land.
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
  paint();
  window.__DUEL = { sheet:paint, FIGHTERS };
} else {
  startFight();
  booted = true;
  requestAnimationFrame(frame);

  /* An automated or occluded browser reports `document.hidden`, so rAF
     parks and the fight can never be OBSERVED in one — only stepped. This
     handle is how the engine gets reviewed at all. */
  window.__DUEL = {
    state, FIGHTERS, ARENAS, POSES,
    // exported so placement can be MEASURED rather than eyeballed: animation
    // cannot be watched in an automated browser, so the decision has to be
    // steppable on its own
    impactPoint, segPair,
    metrics(){ return { W, H, DPR, rigScale, spaceScale, groundY }; },
    resize,
    restart: startFight,
    setFight(a, b, arena){ FORCE = { a, b, arena:arena||null }; startFight(); },
    step(ms, times){
      const n = times || 1;
      for(let i=0;i<n;i++){ tick((ms||16.7)/1000); render((ms||16.7)/1000); }
      return { beat:state.beatIdx, of:state.fight.beats.length,
               phase:state.phase, clock:+state.clock.toFixed(2) };
    },
    seek(seconds){
      const n = Math.round(seconds*1000/16.7);
      for(let i=0;i<n;i++){ tick(0.0167); render(0.0167); }
      return { beat:state.beatIdx, of:state.fight.beats.length,
               phase:state.phase, clock:+state.clock.toFixed(2) };
    }
  };
}

})();
</script>
